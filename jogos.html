<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jogos</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Inter;src:url(fontes/Inter-Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fontes/Inter-Bold.ttf);font-weight:700}
:root{--fundo:#140826;--fundo2:#160A2C;--painel:rgba(22,10,44,.86);--vidro:rgba(255,255,255,.07);--borda:rgba(255,255,255,.14);--verde:#00FF8C;--verde2:#8CE6C8;--ouro:#F5D237;--amarelo:#FFC846;--real:#5ADC78;--texto:#F5F8FC;--texto2:#D2C8E6;--texto3:#9C93B5;--slime:#61D808;--agua:#0FADD7;--estrela:#E6C414;--contorno:#0E1420}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--fundo);color:var(--texto);font-family:Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--fundo) var(--fundo-img,none) center/cover no-repeat}
#app::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,4,22,.55),rgba(10,4,22,.82) 40%,rgba(10,4,22,.92));pointer-events:none}
header{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top))}
.voltar{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--vidro);border:1px solid var(--borda)}
header h1{font-size:22px;font-weight:700;letter-spacing:.5px;flex:1}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--texto3);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
.selo-j2{height:30px;padding:0 10px;border-radius:9px;display:grid;place-items:center;background:var(--contorno);border:2px solid #fff;font-weight:700;font-size:15px;letter-spacing:-.5px;box-shadow:0 0 14px rgba(97,216,8,.35)}
.selo-j2 b{color:var(--slime)}.selo-j2 i{color:var(--agua);font-style:normal}
main{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:96px}
.secao{padding:6px 16px 4px;display:flex;align-items:baseline;justify-content:space-between}
.secao h2{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--verde)}
.secao span{font-size:11px;color:var(--texto3)}
.prateleira{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 16px 18px;scrollbar-width:none}
.prateleira::-webkit-scrollbar{display:none}
.tile{flex:0 0 212px;scroll-snap-align:start;border-radius:14px;overflow:hidden;background:var(--fundo2);border:1px solid rgba(60,70,95,.9);text-align:left;position:relative}
.tile.sel{border:3px solid #fff;box-shadow:0 0 0 2px var(--cor),0 0 22px var(--cor)}
.tarja{height:30px;display:flex;align-items:center;gap:7px;padding:0 10px;background:linear-gradient(90deg,var(--cor),color-mix(in srgb,var(--cor) 55%,#0a1030));font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.capa{aspect-ratio:1;width:100%;background:linear-gradient(160deg,var(--cor),#101a3c);position:relative;overflow:hidden}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.capa .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:700;color:rgba(220,230,250,.85);text-align:center;padding:10px}
.barra{height:6px;background:rgba(0,0,0,.6);position:relative}
.barra i{position:absolute;left:0;top:0;bottom:0;background:var(--real)}
.barra i.est{background:var(--amarelo)}
.tile .info{padding:9px 11px 12px}
.tile .tt{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pp{font-size:12px;color:var(--texto2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pc{position:absolute;right:8px;top:38px;background:rgba(0,0,0,.72);border-radius:8px;padding:3px 7px;font-size:12px;font-weight:700}
.lista{padding:4px 16px 8px;display:flex;flex-direction:column;gap:8px}
.linha{display:flex;gap:11px;align-items:center;padding:8px;border-radius:12px;background:var(--vidro);border:1px solid var(--borda);text-align:left;width:100%}
.linha .mini{width:52px;height:52px;border-radius:8px;overflow:hidden;flex:none;background:linear-gradient(160deg,var(--cor),#101a3c);position:relative;border-left:4px solid var(--cor)}
.linha .mini img{width:100%;height:100%;object-fit:cover}
.linha .mini .ini{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:18px}
.linha .tx{flex:1;min-width:0}
.linha .tt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .sub{font-size:11px;color:var(--texto3);margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .barra{border-radius:3px;overflow:hidden;height:4px}
.linha .pc{font-size:12px;font-weight:700;color:var(--texto2);min-width:38px;text-align:right}
.parede-tt{padding:8px 16px 2px}
.parede-tt h2{font-size:24px;font-weight:700;color:var(--ouro);text-shadow:2px 3px 0 rgba(0,0,0,.55);letter-spacing:.5px}
.parede-tt p{font-size:12px;color:var(--texto3);margin-top:4px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 16px}
.placa{text-align:left;position:relative;display:block;width:100%;min-width:0}
.placa .moldura{aspect-ratio:1;border:2px solid rgba(255,215,65,.92);box-shadow:0 0 12px rgba(255,210,60,.28),inset 0 0 0 1px rgba(0,0,0,.6);background:linear-gradient(160deg,var(--cor),#101a3c);position:relative;overflow:hidden;border-radius:4px}
.placa .moldura img{width:100%;height:100%;object-fit:cover}
.placa .moldura .ini{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:26px;color:rgba(220,230,250,.85)}
.placa .num{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.75);color:var(--ouro);font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px}
.placa .zer{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:50%;background:var(--ouro);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.placa .tt{font-size:11px;font-weight:700;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.placa .dt{font-size:10px;color:var(--texto3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{position:absolute;z-index:3;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;border-radius:18px;background:rgba(14,8,30,.88);border:1px solid var(--borda);backdrop-filter:blur(12px)}
nav button{flex:1;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:1.4px;color:var(--texto3)}
nav button.on{background:rgba(0,255,140,.12);color:var(--verde);box-shadow:inset 0 0 0 1px rgba(0,255,140,.5)}
#ficha{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;background:var(--fundo)}
#ficha.on{display:flex}
#ficha .fundo-capa{position:absolute;left:0;right:0;top:0;height:420px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3);opacity:.55;transform:scale(1.2)}
#ficha .fundo-capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--fundo) 92%)}
#ficha header{position:relative}
#ficha main{position:relative;padding-bottom:110px}
.topo{display:flex;gap:14px;padding:4px 16px 16px;align-items:flex-end}
.topo .capa{width:132px;flex:none;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.topo .dados{flex:1;min-width:0}
.topo h2{font-size:22px;font-weight:700;line-height:1.15}
.chip{display:inline-flex;align-items:center;gap:5px;margin:8px 6px 0 0;padding:4px 8px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--cor)}
.chip.vidro{background:var(--vidro);border:1px solid var(--borda);color:var(--texto2);text-transform:none;letter-spacing:0;font-weight:400}
.anel{position:relative;width:74px;height:74px;flex:none}
.anel svg{transform:rotate(-90deg)}
.anel b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.anel small{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-size:9px;color:var(--texto3);letter-spacing:.8px;text-transform:uppercase}
.bloco{margin:0 16px 14px;padding:14px;border-radius:16px;background:var(--painel);border:1px solid rgba(0,255,140,.28)}
.bloco h3{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--verde2);margin-bottom:10px}
.parei{font-size:16px;line-height:1.4;font-weight:700}
.parei-sub{font-size:12px;color:var(--texto3);margin-top:6px;line-height:1.4}
.marcou{display:flex;flex-direction:column;gap:10px}
.cartao{padding:13px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(245,210,55,.18),rgba(245,210,55,.04));border:1px solid rgba(245,210,55,.55);position:relative}
.cartao q{display:block;font-size:15px;line-height:1.4;quotes:"\201C" "\201D"}
.cartao .dia{font-size:11px;color:var(--ouro);font-weight:700;letter-spacing:.8px;margin-top:8px}
.selos{display:flex;flex-wrap:wrap;gap:8px}
.selo{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 7px;border-radius:999px;background:rgba(245,210,55,.12);border:1px solid rgba(245,210,55,.5);font-size:12px;font-weight:700;color:#FBE7A0}
.selo span{font-weight:400;color:var(--texto3);font-size:11px}
.tempo{position:relative;padding-left:18px}
.tempo::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--verde),rgba(0,255,140,.1))}
.ev{position:relative;padding:0 0 14px}
.ev::before{content:"";position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--fundo);border:2px solid var(--verde)}
.ev .q{font-size:14px;line-height:1.42}
.ev .q.rel{font-size:12.5px;color:var(--texto2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev .q.ela::before{content:"\201C"}.ev .q.ela::after{content:"\201D"}
.ev .m{font-size:11px;color:var(--texto3);margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap}
.ev .m b{color:var(--verde2);font-weight:700}
.ev .m .nyx{color:#8FE36A}
.ev img{margin-top:8px;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--borda)}
.mais{width:100%;margin-top:4px;padding:10px;border-radius:10px;background:var(--vidro);border:1px solid var(--borda);font-size:12px;font-weight:700;color:var(--texto2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--texto3)}
.kv dd{line-height:1.35}
.sv{padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.sv:first-of-type{border-top:0;padding-top:0}
.sv .h{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.sv .h span{color:var(--texto3);font-weight:400;font-size:12px}
.sv p{font-size:12px;color:var(--texto2);margin-top:4px;line-height:1.4}
.fps{display:flex;gap:8px;flex-wrap:wrap}
.fps div{flex:1 1 140px;padding:10px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--borda)}
.fps b{font-size:22px;display:block}
.fps span{font-size:11px;color:var(--texto3);line-height:1.3;display:block;margin-top:2px}
.colecao{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.poke{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--borda);font-size:13px}
.poke i{width:28px;height:28px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,#fff 0 4px,#222 4px 6px,transparent 6px),linear-gradient(180deg,#E1233C 0 46%,#222 46% 54%,#eee 54%)}
.poke small{display:block;color:var(--texto3);font-size:11px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;padding:5px 9px;border-radius:8px;background:var(--vidro);border:1px solid var(--borda);color:var(--texto2)}
.prints{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prints img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--borda);display:block}
.pend{font-size:12px;line-height:1.45;color:#FFE3A3;padding:10px 12px;border-radius:12px;background:rgba(255,200,70,.08);border:1px dashed rgba(255,200,70,.5);margin-top:8px}
.fab{position:absolute;z-index:6;right:16px;bottom:max(18px,env(safe-area-inset-bottom));height:56px;padding:0 20px 0 16px;border-radius:18px;display:flex;align-items:center;gap:9px;background:var(--verde);color:#062012;font-weight:700;font-size:14px;box-shadow:0 8px 26px rgba(0,255,140,.35),0 2px 0 rgba(0,0,0,.4)}
#envio{position:fixed;inset:0;z-index:8;display:none;align-items:flex-end;background:rgba(4,2,12,.6)}
#envio.on{display:flex}
#envio .folha{width:100%;padding:16px 16px max(16px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#1A0D33;border-top:1px solid rgba(0,255,140,.5)}
#envio .alca{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 12px}
#envio h4{font-size:15px;font-weight:700}
#envio p{font-size:12px;color:var(--texto3);margin:3px 0 12px}
#envio textarea{width:100%;min-height:96px;resize:none;border-radius:14px;padding:12px;background:rgba(0,0,0,.4);border:1px solid var(--borda);color:var(--texto);font:inherit;font-size:15px;outline:none}
#envio textarea:focus{border-color:var(--verde)}
#envio .acoes{display:flex;gap:8px;margin-top:10px;align-items:center}
#envio .acoes button.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--vidro);border:1px solid var(--borda)}
#envio .acoes .env{flex:1;height:48px;border-radius:14px;background:var(--verde);color:#062012;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
#aviso{position:fixed;z-index:9;left:16px;right:16px;bottom:90px;padding:12px 14px;border-radius:14px;background:#0E2A1C;border:1px solid var(--verde);font-size:13px;display:none}
#abertura{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:var(--contorno);overflow:hidden}
#abertura.on{display:grid}
#abertura .logo{position:relative;text-align:center;font-weight:700;line-height:.86;animation:ab-entra .55s cubic-bezier(.2,1.4,.4,1) both}
#abertura .estrelas{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
#abertura .estrelas svg{animation:ab-brilha 1.2s ease-in-out infinite alternate}
#abertura .jog{display:block;font-size:58px;letter-spacing:-2px;color:var(--slime);-webkit-text-stroke:3px var(--contorno);paint-order:stroke fill;text-shadow:0 0 0 #fff,0 5px 0 #3C8A12,0 0 26px rgba(97,216,8,.45);transition:all .45s cubic-bezier(.6,0,.3,1)}
#abertura .a2{display:block;font-size:72px;color:var(--agua);-webkit-text-stroke:3px var(--contorno);paint-order:stroke fill;text-shadow:0 5px 0 #0B6E8C,0 0 26px rgba(15,173,215,.5);margin-top:4px;transition:all .45s cubic-bezier(.6,0,.3,1)}
#abertura .jog .r{display:inline-block;transition:all .45s cubic-bezier(.6,0,.3,1);max-width:6em;overflow:hidden;vertical-align:bottom}
#abertura .a2 .r{display:inline-block;transition:all .45s cubic-bezier(.6,0,.3,1);max-width:1em;overflow:hidden;vertical-align:bottom}
#abertura.j2 .jog .r,#abertura.j2 .a2 .r{max-width:0;opacity:0}
#abertura.j2 .logo{display:flex;align-items:flex-end;gap:2px}
#abertura.j2 .estrelas{position:absolute;left:0;right:0;top:-46px}
#abertura .pular{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.45);text-transform:uppercase}
#abertura.sai{animation:ab-sai .3s ease-in forwards}
@keyframes ab-entra{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ab-brilha{from{transform:scale(.85) rotate(-8deg)}to{transform:scale(1.1) rotate(8deg)}}
@keyframes ab-sai{to{opacity:0;transform:scale(1.08)}}
#troca{position:fixed;inset:0;z-index:19;background:#000;pointer-events:none;opacity:0}
#troca.on{animation:troca .3s ease-out}
@keyframes troca{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="troca"></div>
<div id="abertura" aria-label="Abertura Jogando A2" role="button" tabindex="0">
<div class="logo">
<div class="estrelas"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="#E6C414" stroke="#0E1420" stroke-width="2"/></svg><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="#E6C414" stroke="#0E1420" stroke-width="2"/></svg><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="#E6C414" stroke="#0E1420" stroke-width="2"/></svg></div>
<span class="jog">J<span class="r">OGANDO</span></span>
<span class="a2"><span class="r">A</span>2</span>
</div>
<div class="pular">toque pra pular</div>
</div>
<div id="app">
<header>
<button class="voltar" id="voltar-app" aria-label="Voltar pros recados"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<h1>Jogos<small id="sub"></small></h1>
<div class="selo-j2" aria-label="Jogando A2"><span><b>J</b><i>2</i></span></div>
</header>
<main id="lista"></main>
<nav>
<button id="tab-jogando" class="on" data-aba="jogando"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.96 3.43L2 14.5A3 3 0 0 0 7.2 17l1.3-1.5h7l1.3 1.5a3 3 0 0 0 5.2-2.5l-.74-6.07A4 4 0 0 0 17.3 5z"/></svg>JOGANDO</button>
<button id="tab-concluidos" data-aba="concluidos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>CONCLUÍDOS</button>
</nav>
</div>
<section id="ficha" aria-modal="true" role="dialog">
<div class="fundo-capa" id="f-fundo"></div>
<header>
<button class="voltar" id="f-voltar" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<h1 style="font-size:14px;color:var(--texto3);font-weight:700;letter-spacing:1.4px;text-transform:uppercase">Ficha do jogo</h1>
<div class="selo-j2"><span><b>J</b><i>2</i></span></div>
</header>
<main id="f-corpo"></main>
<button class="fab" id="f-msg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg>Mandar algo</button>
</section>
<div id="envio">
<div class="folha">
<div class="alca"></div>
<h4 id="e-tt">Mandar algo sobre este jogo</h4>
<p>Vai pra Geral, pra Nyx e o Orfeu porem datado na história deste jogo.</p>
<textarea id="e-txt" placeholder="vai q lembra de algo..."></textarea>
<div class="acoes">
<button class="env" id="e-env"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>Enviar</button>
</div>
</div>
</div>
<div id="aviso"></div>
<script>
// Tela Jogos do app (Orfeu, 05/11/2026). O código é público; os dados e as imagens dela vêm do Inst privado com a mesma chave do app.
const REPO="mayarainstinct-stack/Inst",TOKEN=(()=>{try{return localStorage.getItem("gh-token")||""}catch(e){return""}})()
const apiDe=p=>"https://api.github.com/repos/"+REPO+"/contents/"+p.split("/").map(encodeURIComponent).join("/")
const gh=(p,op={})=>fetch(apiDe(p),{cache:"no-cache",...op,headers:{Authorization:"Bearer "+TOKEN,Accept:"application/vnd.github+json",...(op.headers||{})}})
const blobs={}
function priv(p){return blobs[p]||(blobs[p]=gh(p,{headers:{Accept:"application/vnd.github.raw"},cache:"default"}).then(r=>{if(!r.ok)throw r.status;return r.blob()}).then(b=>URL.createObjectURL(b)))}
function hidrata(raiz){(raiz||document).querySelectorAll("img[data-p]").forEach(im=>{const p=im.dataset.p;im.removeAttribute("data-p");priv(p).then(u=>{im.src=u}).catch(()=>im.remove())})}
const ehPriv=u=>u&&!/^(https?:|data:|blob:)/.test(u)
const escA=x=>String(x).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")
function srcAttr(u){return ehPriv(u)?`data-p="${escA(u)}"`:`src="${escA(u)}"`}
async function carrega(){
if(!TOKEN){location.replace("app.html");return}
const r=await gh("categorias/games/tela-jogos.json",{headers:{Accept:"application/vnd.github.raw"}})
if(!r.ok)throw new Error("dados "+r.status)
window.JOGOS=await r.json()
priv("categorias/games/mock-tela-jogos/fundo.jpg").then(u=>document.getElementById("app").style.setProperty("--fundo-img",`url("${u}")`)).catch(()=>{})
}
carrega().then(comeca).catch(e=>{document.body.innerHTML='<p style="padding:24px;font:600 16px system-ui;color:#fff">Não consegui abrir os jogos. Confere a internet e tenta de novo.</p><p style="padding:0 24px"><a href="app.html" style="color:#8CE6C8;font:600 15px system-ui">Voltar pros recados</a></p>'})
function comeca(){
const D=window.JOGOS,J=D.jogos,POR={};J.forEach(j=>POR[j.id]=j)
const RAIZ_INST="",RAIZ_DOCS=""
const esc=s=>String(s??"").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu,"").replace(/\s{2,}/g," ").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))
function cor(c){c=c||"";if(/Switch|3DS|Wii|Nintendo Switch/.test(c))return"#E1233C";if(/Super Nintendo/.test(c))return"#5E409D";if(/64/.test(c))return"#2EAF6E";if(/PS|PlayStation/.test(c))return"#286EDC";if(/Xbox/.test(c))return"#107C10";if(/PC/.test(c))return"#FF8C1E";return"#3C3C5A"}
function curto(c){if(!c)return"CONSOLE ?";return c.replace("Switch 2 (emulador no PC)","Switch 2 · emu").replace("Switch (emulador no PC)","Switch · emu").replace("Wii U (emulador no PC)","Wii U · emu").replace("Nintendo Switch","Switch").replace("Nintendo 3DS","3DS").replace("PlayStation ","PS").replace("Super Nintendo","SNES").replace("Nintendo 64","N64")}
const ICO={switch:'<svg width="16" height="14" viewBox="0 0 24 20" fill="#fff"><rect x="1" y="1" width="9" height="18" rx="4"/><rect x="14" y="1" width="9" height="18" rx="4"/><circle cx="5.5" cy="6" r="1.6" fill="#0003"/><circle cx="18.5" cy="13" r="1.6" fill="#0003"/></svg>',ps:'<svg width="18" height="14" viewBox="0 0 30 20"><text x="0" y="16" font-family="Segoe UI,Inter" font-weight="700" font-style="italic" font-size="17" fill="#fff">PS</text></svg>',pc:'<svg width="16" height="14" viewBox="0 0 24 20" fill="none" stroke="#fff" stroke-width="2.4"><rect x="2" y="1.5" width="20" height="12" rx="2"/><path d="M8 18.5h8M12 14v4"/></svg>',outro:'<svg width="16" height="14" viewBox="0 0 24 20" fill="none" stroke="#fff" stroke-width="2.2"><rect x="2" y="4" width="20" height="12" rx="6"/><path d="M7 8v4M5 10h4"/></svg>'}
function icone(c){c=c||"";if(/Switch|3DS|Wii|Nintendo|SNES|Super Nintendo|64/.test(c))return ICO.switch;if(/PS|PlayStation/.test(c))return ICO.ps;if(/PC/.test(c))return ICO.pc;return ICO.outro}
function capaUrl(j){if(j.capa)return j.capa;const p=j.parede&&j.parede.imagens&&j.parede.imagens[0];if(p)return RAIZ_DOCS+p.arquivo;return null}
function iniciais(t){return t.replace(/[^A-Za-zÀ-ÿ0-9 ]/g,"").split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function capaHtml(j,cls){const u=capaUrl(j);return u?`<img loading="lazy" ${srcAttr(u)} alt="" onerror="this.remove()"><div class="ini" style="z-index:-1">${esc(iniciais(j.titulo))}</div>`:`<div class="ini">${esc(iniciais(j.titulo))}</div>`}
function pctTxt(j){return j.pct==null?"":(j.estimado?"~":"")+j.pct+"%"}
function barra(j){return j.pct==null?'<div class="barra"></div>':`<div class="barra"><i class="${j.estimado?"est":""}" style="width:${Math.max(0,Math.min(100,j.pct))}%"></i></div>`}
function ultimoDia(j){let best=0;(j.historico||[]).concat(j.relatos||[]).forEach(h=>{if(!h.dia)return;const[d,m,a]=h.dia.split("/").map(Number);const v=a*10000+m*100+d;if(v>best)best=v});return best}
let aba="jogando"
function render(){setTimeout(()=>hidrata(document.getElementById("lista")),0);
const L=document.getElementById("lista");document.getElementById("tab-jogando").classList.toggle("on",aba=="jogando");document.getElementById("tab-concluidos").classList.toggle("on",aba=="concluidos")
if(aba=="jogando"){
const princ=J.filter(j=>j.principal||j.status=="quer_terminar").sort((a,b)=>ultimoDia(b)-ultimoDia(a))
const abertos=J.filter(j=>!j.principal&&(j.status=="jogando")).sort((a,b)=>(b.pct??-1)-(a.pct??-1))
document.getElementById("sub").textContent=`${princ.length} na prateleira · ${abertos.length} abertos`
L.innerHTML=`<div class="secao"><h2>Um de cada console</h2><span>o mais recente primeiro</span></div><div class="prateleira">${princ.map((j,i)=>`<button class="tile${i==0?" sel":""}" style="--cor:${cor(j.console)}" data-id="${j.id}"><div class="tarja">${icone(j.console)}${esc(curto(j.console))}</div><div class="capa">${capaHtml(j)}</div>${barra(j)}${j.pct!=null?`<div class="pc">${pctTxt(j)}</div>`:""}<div class="info"><div class="tt">${esc(j.titulo)}</div><div class="pp">${esc(j.parei||"onde parou ainda não anotado")}</div></div></button>`).join("")}</div><div class="secao"><h2>Abertos</h2><span>${abertos.length} jogos</span></div><div class="lista">${abertos.slice(0,40).map(linha).join("")}</div>`
}else{
const z=J.filter(j=>j.status=="zerado").sort((a,b)=>((a.parede?a.parede.numero:999)-(b.parede?b.parede.numero:999))||a.titulo.localeCompare(b.titulo))
document.getElementById("sub").textContent=`${z.length} zerados`
L.innerHTML=`<div class="parede-tt"><h2>PAREDE DA VITÓRIA</h2><p>${z.length} zerados · ${z.filter(j=>j.parede).length} com plaquinha no launcher</p></div><div class="grade">${z.map(j=>`<button class="placa" style="--cor:${cor(j.console)}" data-id="${j.id}"><div class="moldura">${capaHtml(j)}${j.parede?`<span class="num">Nº ${String(j.parede.numero).padStart(2,"0")}</span>`:""}<span class="zer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3a2a00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div><div class="tt">${esc(j.titulo)}</div><div class="dt">${esc((j.parede&&j.parede.data)||curto(j.console))}</div></button>`).join("")}</div>`
}
L.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>abrir(b.dataset.id))
}
function linha(j){return`<button class="linha" style="--cor:${cor(j.console)}" data-id="${j.id}"><div class="mini">${capaHtml(j)}</div><div class="tx"><div class="tt">${esc(j.titulo)}</div><div class="sub">${esc(curto(j.console))}${j.parei?" · "+esc(j.parei):""}</div>${barra(j)}</div><div class="pc">${pctTxt(j)}</div></button>`}
function anel(j){const p=j.pct??0,r=31,c=2*Math.PI*r,col=j.pct==null?"#555":j.estimado?"#FFC846":"#5ADC78";return`<div class="anel"><svg width="74" height="74"><circle cx="37" cy="37" r="${r}" stroke="rgba(255,255,255,.12)" stroke-width="7" fill="none"/><circle cx="37" cy="37" r="${r}" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg><b>${j.pct==null?"?":pctTxt(j)}</b><small>${j.pct==null?"sem %":j.estimado?"estimado":"do jogo"}</small></div>`}
const IC={pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',tempo:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',estrela:'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>',selo:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>',save:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-6h8v6"/></svg>',fps:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/></svg>',bau:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="9" width="18" height="11" rx="1"/><path d="M3 9a9 5 0 0 1 18 0M11 12h2v3h-2z"/></svg>',img:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',alerta:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>'}
const SELO_IC={"zerado":'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5D237" stroke-width="2.4" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>'}
function dval(h){if(!h.dia)return 0;const[d,m,a]=h.dia.split("/").map(Number);return a*10000+m*100+d+(h.hora?Number(h.hora.replace(":",""))/10000:0)}
let fichaAtual=null,histTodos=false
function abrir(id){fichaAtual=POR[id];histTodos=false;desenhaFicha();const f=document.getElementById("ficha");f.classList.add("on");document.getElementById("f-corpo").scrollTop=0;if(location.hash!="#jogo="+id)history.replaceState(null,"","#jogo="+id)}
function desenhaFicha(){
const j=fichaAtual,u=capaUrl(j),c=cor(j.console)
const ff=document.getElementById("f-fundo");ff.style.backgroundImage=`linear-gradient(160deg,${c},#101a3c)`;if(u)(ehPriv(u)?priv(u):Promise.resolve(u)).then(x=>{if(fichaAtual===j)ff.style.backgroundImage=`url("${x}")`}).catch(()=>{})
const ev=[];(j.historico||[]).forEach(h=>ev.push({dia:h.dia,hora:h.hora,onde:h.onde,texto:h.fala,quem:"May"}));(j.relatos||[]).forEach(r=>ev.push({dia:r.dia,hora:r.hora,texto:r.texto.replace(/^📷\s*\S+\s*/,"").replace(/\*\*/g,""),quem:r.quem,foto:(r.texto.match(/^📷\s*(\S+)/)||[])[1]}))
ev.sort((a,b)=>dval(b)-dval(a))
const vis=histTodos?ev:ev.slice(0,6)
const des=j.desbloqueados||{},saves=j.save||[],fps=j.fps||[]
let h=`<div class="topo" style="--cor:${c}"><div class="capa" style="--cor:${c}">${capaHtml(j)}</div><div class="dados"><h2>${esc(j.titulo)}</h2><span class="chip">${icone(j.console)}${esc(curto(j.console))}</span>${j.emulador?`<span class="chip vidro">${esc(j.emulador.split(" · ")[0])}</span>`:""}<div style="margin-top:14px;display:flex;align-items:center;gap:12px">${anel(j)}<div style="font-size:12px;color:var(--texto2);line-height:1.4">${esc(rotuloStatus(j.status))}</div></div></div></div>`
h+=`<div class="bloco"><h3>${IC.pin}Onde parei</h3><div class="parei">${esc(j.parei||"Ainda não anotado")}</div>${saves[0]&&saves[0].progresso?`<div class="parei-sub">No save (${esc(saves[0].data||"")}): ${esc(saves[0].progresso)}</div>`:""}${(j.pendencias||[]).filter(p=>/divergente/.test(p)).map(p=>`<div class="pend">${esc(p)}</div>`).join("")}</div>`
if((j.o_que_me_marcou||[]).length)h+=`<div class="bloco" style="border-color:rgba(245,210,55,.45)"><h3 style="color:var(--ouro)">${IC.estrela}O que me marcou</h3><div class="marcou">${j.o_que_me_marcou.map(m=>`<div class="cartao"><q>${esc(m.fala)}</q><div class="dia">${esc(m.dia||"")}${m.nota?" · "+esc(m.nota):""}</div></div>`).join("")}</div></div>`
if((j.conquistas||[]).length)h+=`<div class="bloco"><h3>${IC.selo}Conquistas e feitos</h3><div class="selos">${j.conquistas.map(s=>`<div class="selo">${SELO_IC.zerado}${esc(s.selo)}${s.dia?`<span>${esc(s.dia)}</span>`:""}</div>`).join("")}</div>${j.parede&&j.parede.lembranca?`<div class="parei-sub" style="margin-top:12px">Plaquinha nº ${String(j.parede.numero).padStart(2,"0")} da parede: ${esc(j.parede.lembranca)}</div>`:""}</div>`
if((des.pokemons||[]).length||(des.itens||[]).length||(des.outros||[]).length)h+=`<div class="bloco"><h3>${IC.bau}Coleção</h3>${(des.pokemons||[]).length?`<div class="colecao">${des.pokemons.map(p=>`<div class="poke"><i></i><div>${esc(p.nome)}<small>${p.nivel?"nv "+p.nivel:""}${p.onde?" · "+esc(p.onde):""}</small></div></div>`).join("")}</div>`:""}<div class="tags">${(des.itens||[]).map(x=>`<span>${esc(x)}</span>`).join("")}${(des.outros||[]).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`
h+=`<div class="bloco"><h3>${IC.tempo}História</h3>${ev.length?`<div class="tempo">${vis.map(e=>`<div class="ev"><div class="m"><b>${esc(e.dia||"sem data")}${e.hora?" "+esc(e.hora):""}</b>${e.quem!="May"?`<span class="nyx">${esc(e.quem)} mediu</span>`:""}${e.onde?`<span>${esc(e.onde)}</span>`:""}</div><div class="q ${e.quem=="May"?"ela":"rel"}">${esc(e.texto)}</div>${e.foto?`<img loading="lazy" data-p="${esc(e.foto.split(",")[0])}" alt="">`:""}</div>`).join("")}</div>${ev.length>6&&!histTodos?`<button class="mais" id="h-mais">ver as ${ev.length} entradas</button>`:""}`:`<div class="parei-sub">Nada ainda. Manda algo pelo botão aqui embaixo.</div>`}</div>`
if(saves.length||fps.length)h+=`<div class="bloco"><h3>${IC.save}Save e FPS</h3>${fps.length?`<div class="fps">${fps.slice(0,4).map(f=>`<div><b>${esc(f.media)}</b><span>${esc(f.emulador||"")}${f.dia?" · "+esc(f.dia):""}</span></div>`).join("")}</div>`:""}<div style="margin-top:${fps.length?12:0}px">${saves.map(s=>`<div class="sv"><div class="h">${esc(s.emulador||"nativo")}<span>${esc([s.data,s.tempo_jogado].filter(Boolean).join(" · "))}</span></div>${s.progresso?`<p>${esc(s.progresso)}</p>`:""}</div>`).join("")}</div></div>`
const pr=(j.prints||[]).filter(p=>p.existe!==false)
if(pr.length)h+=`<div class="bloco"><h3>${IC.img}Prints</h3><div class="prints">${pr.map(p=>`<img loading="lazy" data-p="${esc(p.arquivo)}" alt="">`).join("")}</div></div>`
document.getElementById("f-corpo").innerHTML=h;hidrata(document.getElementById("f-corpo"))
const m=document.getElementById("h-mais");if(m)m.onclick=()=>{histTodos=true;desenhaFicha()}
document.getElementById("e-tt").textContent="Mandar algo sobre "+j.titulo
}
function rotuloStatus(s){return{jogando:"Jogando agora",quer_terminar:"Parou, mas quer terminar",parado:"Começou e parou",zerado:"Zerado · parede da vitória",largado:"Largado",nao_comecou:"Ainda não começou",espiou:"Só espiou",bloqueado:"Bloqueado por acesso",nao_funciona:"Não funciona mais",casual:"Casual, sem %",assistiu:"Do Gabriel, ela assistiu",colecao:"Coleção por nostalgia",memoria:"Memória antiga",de_olho:"De olho"}[s]||"Sem status"}
document.getElementById("f-voltar").onclick=()=>{document.getElementById("ficha").classList.remove("on");history.replaceState(null,"","#"+aba)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{aba=b.dataset.aba;history.replaceState(null,"","#"+aba);render();document.getElementById("lista").scrollTop=0})
document.getElementById("f-msg").onclick=()=>{document.getElementById("envio").classList.add("on");setTimeout(()=>document.getElementById("e-txt").focus(),50)}
document.getElementById("envio").onclick=e=>{if(e.target.id=="envio")e.currentTarget.classList.remove("on")}
document.getElementById("e-env").onclick=async()=>{const t=document.getElementById("e-txt").value.trim();if(!t)return;const b=document.getElementById("e-env"),a=document.getElementById("aviso"),n=new Date(),p=x=>String(x).padStart(2,"0");b.disabled=true
const linha=`- [${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()} ${p(n.getHours())}:${p(n.getMinutes())}] @Nyx @Orfeu sobre o jogo ${fichaAtual.titulo}: ${t.replace(/\r?\n/g,"\\n")}`
let ok=false;for(let k=0;k<4&&!ok;k++){try{const f=await(await gh("CAIXA-DE-ENTRADA.md")).json();const md=decodeURIComponent(escape(atob(f.content.replace(/\n/g,""))));if(!md.includes("## Recados")||md.length<200)break;const novo=md.replace(/\s*$/,"")+"\n"+linha+"\n";const r=await gh("CAIXA-DE-ENTRADA.md",{method:"PUT",body:JSON.stringify({message:"recado do iPhone (jogos)",content:btoa(unescape(encodeURIComponent(novo))),sha:f.sha})});if(r.ok)ok=true;else if(r.status!==409)break;else await new Promise(z=>setTimeout(z,600))}catch(e){break}}
b.disabled=false;if(ok){document.getElementById("e-txt").value="";document.getElementById("envio").classList.remove("on");a.textContent="Mandado pra Geral. A Nyx e o Orfeu põem na história do jogo."}else a.textContent="Não consegui mandar. Confere a internet e tenta de novo.";a.style.display="block";setTimeout(()=>a.style.display="none",3200)}
function aberturaJogos(pronto,parar){const el=document.getElementById("abertura"),rm=matchMedia("(prefers-reduced-motion: reduce)").matches;if(rm){pronto();return}el.classList.add("on");let fim=false;const sai=()=>{if(fim)return;fim=true;el.classList.add("sai");setTimeout(()=>{el.classList.remove("on","sai","j2");const t=document.getElementById("troca");t.classList.remove("on");void t.offsetWidth;t.classList.add("on");pronto()},300)};el.onclick=sai;el.onkeydown=e=>{if(e.key=="Enter"||e.key==" "||e.key=="Escape")sai()};if(parar=="logo")return;setTimeout(()=>el.classList.add("j2"),1100);if(parar=="j2")return;setTimeout(sai,2000)}
function iniciar(){const hs=location.hash.slice(1);if(hs.startsWith("jogo=")){aba=POR[hs.slice(5)]&&POR[hs.slice(5)].status=="zerado"?"concluidos":"jogando";render();abrir(hs.slice(5));return}if(hs=="concluidos")aba="concluidos";render()}
document.getElementById("voltar-app").onclick=()=>{location.href="app.html"}
const q=new URLSearchParams(location.search)
if(q.has("semabertura"))iniciar();else aberturaJogos(iniciar,q.get("parar"))
}
</script>
