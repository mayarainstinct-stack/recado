<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recados">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#047857">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Recados</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  /* Casca: abre em branco e monta a página na hora, sempre com a versão mais nova do app.html. */
  html, body { margin: 0; height: 100%; background: #fff; }
  @media (prefers-color-scheme: dark) { html, body { background: #08140F; } }
  .ld { position: fixed; inset: 0; display: grid; place-items: center; }
  .ld i { width: 34px; height: 34px; border-radius: 50%; border: 4px solid #10B981; border-top-color: transparent; animation: g .7s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  p { font: 15px system-ui, sans-serif; color: #64748B; text-align: center; padding: 0 24px; }
  button { display: block; margin: 0 auto; font: 600 16px system-ui, sans-serif; color: #fff; background: #059669; border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer; }
</style>
</head>
<body>
<div class="ld"><i></i></div>
<script>
// no-cache: revalida (304 quando nada mudou) e sempre pega a versão nova; sem cache offline de propósito (incidente de 03/11)
// "Tentar de novo": no app da tela de início do iPhone não existe puxar pra recarregar
function abre() {
  document.body.innerHTML = '<div class="ld"><i></i></div>';
  fetch('app.html', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(html => { try { localStorage.setItem('app-html', html); } catch (e) {} return html; })   // cópia no celular: sem internet abre a última (May, 10/11/2026)
    .catch(e => { let h = null; try { h = localStorage.getItem('app-html'); } catch (e2) {} if (h) return h; throw e; })
    .then(html => { document.open(); document.write(html); document.close(); })
    .catch(() => { document.body.innerHTML = '<div class="ld"><div><p>Não consegui abrir. Confere a internet.</p><button type="button" onclick="abre()">Tentar de novo</button></div></div>'; });
}
abre();
</script>
</body>
</html>
