<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recados">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#047857">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Recados</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  /* Casca: abre em branco e monta a página na hora, sempre com a versão mais nova do app.html. */
  html, body { margin: 0; height: 100%; background: #fff; }
  @media (prefers-color-scheme: dark) { html, body { background: #08140F; } }
  .ld { position: fixed; inset: 0; display: grid; place-items: center; }
  .ld i { width: 34px; height: 34px; border-radius: 50%; border: 4px solid #10B981; border-top-color: transparent; animation: g .7s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  p { font: 15px system-ui, sans-serif; color: #64748B; text-align: center; padding: 0 24px; }
</style>
</head>
<body>
<div class="ld"><i></i></div>
<script>
fetch('app.html?t=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(() => { document.body.innerHTML = '<p>Não consegui abrir. Confere a internet e puxa a tela pra baixo pra tentar de novo.</p>'; });
</script>
</body>
</html>
