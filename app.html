<style>
/* Paleta (verde #059669, petróleo #1E6685, folha #6BAD3E; escuro com azul #22A7D0). Página estática (GitHub Pages). Cada recado vira uma linha em CAIXA-DE-ENTRADA.md no repo privado, pela API do GitHub,
   com um token que fica só no iPhone dela. Nenhum recado mora nesta página. */
:root {
  --bg: #F2FBF6; --paper: #FFFFFF; --fg: #1E293B; --muted: #64748B; --line: #E2E8F0;
  --head: #0EA371; --head-fg: #FFFFFF; --mine: #2F9E44; --mine-fg: #FFFFFF;
  --theirs: #FFFFFF; --cinza: #EEF1F4; --accent: #059669; --accent-fg: #FFFFFF; --pink: #6BAD3E; --err: #B91C1C;
  --font-ui: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif; --font-name: "Young Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #08140F; --paper: #0C1A14; --fg: #F1F5F9; --muted: #8B9DAF; --line: #1C3A2E;
    --head: #0B2A20; --head-fg: #ECFDF5; --mine: #237A36; --mine-fg: #F1FFF3; --theirs: #13261E; --cinza: #1B2522;
    --accent: #10B981; --accent-fg: #052E22; --pink: #5FBB53; --err: #FCA5A5; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; overscroll-behavior: none; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; }
.app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; background: var(--paper); }
/* Topo no padrão de app mobile: faixa na cor da marca subindo atrás da barra de status,
   cantos de baixo arredondados, logo + "Recados" + status do agente (online/offline), ⋮ à direita, respiro 16. */
header { position: relative; z-index: 2; color: var(--head-fg); font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
  background: var(--head);
  background: linear-gradient(160deg, color-mix(in srgb, var(--head) 80%, #fff) 0%, var(--head) 60%);
  border-radius: 0 0 24px 24px; box-shadow: 0 6px 18px color-mix(in srgb, var(--head) 28%, transparent);
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
  display: grid; gap: 8px; border-radius: 0 0 18px 18px; }
.topo { display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border-radius: 11px; flex: none; background: #fff url("apple-touch-icon.png") center / cover;
  box-shadow: 0 3px 10px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.6); }
.who { min-width: 0; flex: 1; display: grid; gap: 3px; justify-items: start; }
.titulo-linha { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo:not([hidden]) ~ .who .conv-av { display: none; }   /* com o logo grande à esquerda a foto pequena repetia (May, 05/11/2026) */
.conv-av { width: 26px; height: 26px; border-radius: 50%; flex: none; background-size: cover; background-position: center; background-color: rgba(255,255,255,.18); }
.who h1 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.1; letter-spacing: -.015em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.18);
  border-radius: 999px; padding: 4px 10px 4px 8px; transition: background-color .3s ease; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: #BBF7D0; box-shadow: 0 0 0 0 rgba(187,247,208,.7); animation: vivo 2s infinite; }
.status.ausente .dot { background: #FDE68A; animation: none; }
.status.off .dot { background: rgba(255,255,255,.55); animation: none; }
.status.off { background: rgba(0,0,0,.12); }
@keyframes vivo { 0% { box-shadow: 0 0 0 0 rgba(187,247,208,.7); } 70% { box-shadow: 0 0 0 7px rgba(187,247,208,0); } 100% { box-shadow: 0 0 0 0 rgba(187,247,208,0); } }
.status .sync { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; display: none; }
.status.on .dot { display: none; }
.status.on .sync { display: block; animation: gira .8s linear infinite; }
.semana { flex: none; position: relative; width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.22); display: grid; place-items: center; color: #FACC15; cursor: pointer; touch-action: manipulation; user-select: none; }   /* o % dos 7 dias num anel amarelo que enche (May, 05/11/2026) */
.semana svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.semana .fundo { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 3.2; }
.semana .cheio { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; filter: drop-shadow(0 0 3px currentColor); }
.semana b { position: relative; font-size: 13px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.semana b small { font-size: 8px; font-weight: 800; }
.semana.ok { color: #4ADE80; } .semana.alto { color: #FACC15; } .semana.estouro { color: #F87171; }
.semana[hidden] { display: none; }
#mais { background: none; }   /* os 3 pontinhos sem o círculo: o círculo é do % (May: tava invertido) */
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.16); color: var(--head-fg);
  font-size: 22px; line-height: 1; display: grid; place-items: center; }
/* Badge "N agentes online agora" (só em conversa de grupo, ex. Casa (PCs)): toca pra abrir a lista com foto + visto por último */
.online-badge { width: auto; height: auto; justify-self: start; background: rgba(255,255,255,.18); color: var(--head-fg);
  border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; }
.online-pop { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(96px + env(safe-area-inset-top, 0px));
  min-width: 250px; max-width: 320px; max-height: calc(100dvh - 110px - env(safe-area-inset-top, 0px)); overflow-y: auto;   /* cabe todo mundo sem rolar (May, 05/11/2026) */ background: var(--paper); color: var(--fg);
  border: 1px solid var(--line); border-radius: 16px; padding: 6px; z-index: 5; display: grid; gap: 2px;
  box-shadow: 0 12px 32px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.10); }
.online-pop:not([hidden]) { animation: abre .18s ease-out both; transform-origin: top left; }
.online-pop .vazio { padding: 10px 8px; font-size: 13px; color: var(--muted); }
.online-pop .pessoa { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 12px; }
.online-pop .av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700;
  font-size: 18px; background-size: cover; background-position: center; }
.online-pop .info { min-width: 0; display: grid; gap: 2px; }
.online-pop .nome { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.online-pop .visto { font-size: 12.5px; color: var(--muted); }
.online-pop .visto.on { color: var(--accent); font-weight: 600; }   /* era .ag, que é a classe do cartão da agenda: virava caixinha e deixava a linha mais alta */
.menu.no-painel { position: fixed; z-index: 57; }   /* aberto de dentro do Menu: fica por cima do painel */
.menu { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(62px + env(safe-area-inset-top, 0px));
  min-width: 232px; background: var(--paper); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 6px; z-index: 5;
  box-shadow: 0 12px 32px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.10); }
.menu button { width: 100%; height: auto; min-height: 48px; border-radius: 10px; background: none; color: var(--fg); padding: 0 14px; text-align: left;
  font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 14px; }
.menu button .mi { width: 28px; flex: none; text-align: center; font-size: 20px; display: grid; place-items: center; }
svg.i { width: 1em; height: 1em; flex: none; vertical-align: -.15em; }
.tick svg.i { width: 1.25em; height: 1.25em; vertical-align: -.3em; }
.ok-mark svg.i { width: 22px; height: 22px; stroke-width: 2.6; }
.p-botao .chev svg.i { width: 20px; height: 20px; }
.desce svg.i { width: 20px; height: 20px; }
.baixar-tudo svg.i, .gostei svg.i, #notificar svg.i, #sair svg.i, .nota-box label svg.i, .foto-x svg.i, .manda svg.i { margin-right: 6px; }
#notificar svg.i, #sair svg.i { width: 20px; height: 20px; margin-right: 0; }
.detalhe .gostei { gap: 0; }
.nota-box label svg.i { color: var(--muted); }
.i-corpo h3 svg.i, .detalhe h3 svg.i { color: #E5A400; margin-right: 6px; }
.menu button:not([hidden]) ~ button:not([hidden]) { border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; }
.menu button:active { background: var(--bg); }
@media (hover: hover) { .menu button:hover { background: var(--bg); } .clip:hover { color: var(--accent); } }
@keyframes gira { to { transform: rotate(360deg); } }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid currentColor; border-top-color: transparent; animation: gira .7s linear infinite; }
.clip { background: none; color: var(--muted); width: 40px; }
.msg .foto { display: block; width: 100%; max-width: 100%; min-height: 120px; max-height: 340px; border-radius: 10px; margin-bottom: 4px;
  background: color-mix(in srgb, var(--accent) 10%, var(--bg)); object-fit: cover; }
/* Animações leves (só CSS): topo desliza, conversa sobe em cascata, botões respondem ao toque. */
header { animation: desce .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes desce { from { transform: translateY(-100%); } }
form { animation: sobe .45s .1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes sobe { from { transform: translateY(100%); } }
#feed.chegando .msg { animation: entra .4s cubic-bezier(.2,.9,.3,1.2) both; }
#feed.chegando .msg:nth-last-child(1) { animation-delay: .35s; }
#feed.chegando .msg:nth-last-child(2) { animation-delay: .28s; }
#feed.chegando .msg:nth-last-child(3) { animation-delay: .21s; }
#feed.chegando .msg:nth-last-child(4) { animation-delay: .14s; }
#feed.chegando .msg:nth-last-child(5) { animation-delay: .07s; }
button { transition: transform .12s ease, opacity .2s ease, background-color .2s ease; }
button:active:not(:disabled) { transform: scale(.9); }
#enviar:not(:disabled) { animation: pulsa .35s ease-out; }
@keyframes pulsa { 50% { transform: scale(1.12); } }
textarea { transition: border-color .2s ease, box-shadow .2s ease; }
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
textarea:focus-visible { outline: none; }
.menu:not([hidden]) { animation: abre .18s ease-out both; transform-origin: top right; }
@keyframes abre { from { opacity: 0; transform: scale(.9); } }
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.overlay-card { display: grid; justify-items: center; gap: 12px; padding: 24px 32px; border-radius: 18px;
  background: var(--paper); color: var(--fg); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.spin.big { width: 38px; height: 38px; border-width: 4px; color: var(--accent); }
.ok-mark { display: none; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-fg);
  font-size: 22px; font-weight: 700; place-items: center; }
.overlay.ok .spin { display: none; }
.overlay.ok .ok-mark { display: grid; animation: entra .3s cubic-bezier(.2,.9,.3,1.3) both; }
#feed { flex: 1; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: none; display: flex; flex-direction: column; gap: 4px;
  padding: 10px max(10px, env(safe-area-inset-right, 0px)) 10px max(10px, env(safe-area-inset-left, 0px)); }
.day { align-self: center; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; margin-block: 8px; }
.msg { max-width: 88%; padding: 7px 11px 5px; border-radius: 14px; line-height: 1.4; box-shadow: 0 1px 0 var(--line); }
.msg.may { align-self: flex-end; background: var(--mine); color: var(--mine-fg); border-bottom-right-radius: 4px; }
.msg.lyra { align-self: flex-start; background: var(--theirs); color: var(--fg); border-bottom-left-radius: 4px; }
/* Balão cinza com a borda lateral na cor hex de quem fala; o nome em cima também na cor (pedido dela) */
.msg.grupo { background: color-mix(in srgb, var(--quem) 16%, var(--cinza)); color: var(--fg); }   /* fundo na cor de quem fala (May, 03/11/2026) */
.msg.grupo .quem { color: var(--quem); }
/* Balão da May: branco, mais clean (May, 05/11/2026: "deixa meu balão branco"); as 2 cores dela ficam só no nome e no aro do avatar */
.msg.may.eu { border: 3.5px solid transparent; background: linear-gradient(#FFFFFF, #FFFFFF) padding-box, linear-gradient(135deg, #E31B23, #FACC15, #22C55E) border-box; color: #1A1A1A; box-shadow: 0 1px 2px rgba(0,0,0,.12); }   /* borda vermelha e verde (May, 05/11/2026) */
.msg.may.eu .meta { color: #6B7280; }
.msg.may.eu .tick.lida { color: #1E8A40; }
.msg.may.eu .cita { background: #F3F4F6; }
.msg.may.eu .cita b { color: var(--quem); }   /* nome de quem foi respondido na cor do robô, não no vermelho dela (May, 05/11/2026) */
.msg.may.eu .cita span { color: #4B5563; }
.msg.may .quem.eu .letra:nth-child(1) { color: #E31B23; }
.msg.may .quem.eu .letra:nth-child(2) { color: #CA8A04; }
.msg.may .quem.eu .letra:nth-child(3) { color: #1E8A40; }
.msg.may .quem.eu .avatar { background-color: transparent; box-shadow: none; background-size: contain; background-repeat: no-repeat; background-position: center; width: 46px; height: 46px; }   /* 104%: o brilho do aro dela deixava o círculo menor que o dos robôs (May, 05/11/2026) */   /* a imagem dela já é redonda e transparente, sem aro (May, 05/11/2026) */
.msg .quem { font-size: 16px; font-weight: 700; margin-bottom: 4px; padding-right: 26px; color: var(--quem); display: flex; align-items: center; gap: 6px; }
.quem .rotulo { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.quem .cargo { font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quem .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--quem); color: var(--quem-fg); font-size: 17px;   /* era 26px, pequeno demais no celular (May, 05/11/2026) */
  font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background-size: cover; background-position: center; }
.marca { font-weight: 700; }
.marca-cor.marca-may { background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 48%, rgba(0,0,0,.12) 52%, rgba(0,0,0,.42)), linear-gradient(90deg, #F0242C, #F5B400 50%, #1FB04A); font-weight: 700; text-shadow: 0 0 3px rgba(0,0,0,.9), 0 1px 1px rgba(0,0,0,.8); }   /* cor no degradê deitado, brilho no degradê em pé: claro em cima, escuro embaixo onde fica a letra (May, 06/11/2026 01:43) */   /* tons escurecidos: o amarelo e o verde claros apagavam a letra branca (May, 06/11/2026 01:36) */
.marca-cor.marca-tres { background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 48%, rgba(0,0,0,.12) 52%, rgba(0,0,0,.42)), linear-gradient(90deg, var(--c1), var(--c2) 50%, var(--c3)); }
.marca-cor.marca-todos { background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 48%, rgba(0,0,0,.12) 52%, rgba(0,0,0,.42)), linear-gradient(90deg, #FF2D2D, #5BC21A, #2F6BFF, #FFC400, #FF3EC8, #A247FF); font-weight: 700; text-shadow: 0 0 3px rgba(0,0,0,.9), 0 1px 1px rgba(0,0,0,.8); }   /* cor no degradê deitado, brilho no degradê em pé: claro em cima, escuro embaixo onde fica a letra (May, 06/11/2026 01:43) */   /* @todos com as cores da casa toda */   /* a pílula dela com as 3 cores (May, 06/11/2026) */
.marca-cor { text-shadow: 0 0 3px rgba(0,0,0,.9), 0 1px 1px rgba(0,0,0,.8); background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 48%, rgba(0,0,0,.12) 52%, rgba(0,0,0,.42)), var(--quem);   /* pílula de vidro em todo mundo (May, 06/11/2026 01:53) */
  color: #FFFFFF; border-radius: 999px;
  padding: 1px 9px; margin: 0 1px; font-size: 13px; display: inline-block; line-height: 1.6; vertical-align: text-bottom; }
.mencoes { display: flex; gap: 6px; flex-wrap: wrap-reverse; justify-content: flex-start; flex-direction: row-reverse; margin: 0 max(24px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.mencoes button { width: auto; height: auto; padding: 4px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
  background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 48%, rgba(0,0,0,.12) 52%, rgba(0,0,0,.42)), var(--quem); color: #FFFFFF; border: none; opacity: .8; text-shadow: 0 0 3px rgba(0,0,0,.9), 0 1px 1px rgba(0,0,0,.8); }
.mencoes button.sel { opacity: 1; outline: 2px solid #FFFFFF; outline-offset: -2px; }
.msg { position: relative; touch-action: pan-y; }
.msg .cita { display: grid; gap: 1px; margin: 2px 0 6px; padding: 6px 10px; border-radius: 8px; border-left: 4px solid var(--quem);
  background: rgba(0,0,0,.06); font-size: 13px; line-height: 1.3; }
.msg .cita b { color: var(--quem); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.cita-av { flex: none; width: 20px; height: 20px; border-radius: 50%; background: center / cover no-repeat; }
.cita-av.eu { border-radius: 0; background-size: contain; }
.msg .cita span { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* no balão verde dela a citação some (rosa e cinza sobre verde): fundo mais escuro e texto claro */
.msg.may .cita { background: rgba(0,0,0,.18); }
.msg.may .cita b { color: var(--quem); }
.msg.may .cita span { color: color-mix(in srgb, var(--mine-fg) 85%, transparent); }
.msg .seta-resp { position: absolute; top: 50%; left: -34px; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; background: var(--paper); color: var(--accent); font-size: 14px; opacity: 0; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
/* player de áudio igual ao do WhatsApp (05/11/2026): play redondo, barrinha com bolinha, tempo embaixo, microfone que vira 1x/1,5x/2x tocando */
.player { --cor: var(--quem, var(--accent)); --cor-fg: var(--quem-fg, var(--accent-fg)); display: flex; align-items: center; gap: 10px; width: 270px; max-width: 100%; margin: 4px 0 2px; }
.msg.may:not(.eu) .player { --cor: var(--mine-fg); --cor-fg: var(--mine); }   /* balão verde: verde da cor do agente sumia */
.player audio, .player [hidden] { display: none; }
.player .tocar { width: 42px; height: 42px; background: var(--cor); color: var(--cor-fg); position: relative; }
.player .tocar svg { width: 20px; height: 20px; }
.player.baixando .tocar::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2.5px solid transparent; border-top-color: var(--cor); animation: gira .8s linear infinite; }
.player .meio { flex: 1; min-width: 0; display: grid; padding-top: 12px; }

  padding: 0 0 env(safe-area-inset-bottom, 0px); animation: entra .18s ease-out both; }
.p-topo { flex: none; display: flex; align-items: center; gap: 10px; background: var(--head); color: var(--head-fg); border-bottom: 1px solid color-mix(in srgb, var(--head-fg) 14%, transparent);
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.p-topo button { flex: none; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.18); color: inherit; font-size: 22px; line-height: 1; display: grid; place-items: center; }
.p-tits { flex: 1; min-width: 0; display: flex; flex-direction: column; } .p-tits h2 { flex: none; } .p-sub { font-size: 12px; font-weight: 700; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.p-ic { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--c); color: #1A1203; box-shadow: 0 4px 12px color-mix(in srgb, var(--c) 45%, transparent); } .p-ic svg { width: 22px; height: 22px; }
.p-topo h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Corpo rolável: coluna flex com filhos que NÃO encolhem (grid + overflow:hidden nos cartões os espremia a ~50px) */
.p-corpo { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 88px max(16px, env(safe-area-inset-left, 0px)); }   /* espaço pro voltar de baixo */
.p-corpo > * { flex: none; min-width: 0; }
.p-corpo > .tela { display: contents; }
.p-corpo > .tela > * { flex: none; min-width: 0; }
.p-extra { flex: none; display: flex; justify-content: center; gap: 4px; padding: 6px 16px; border-top: 1px solid var(--line); background: var(--paper); }
.p-extra button { flex: 1; max-width: 220px; min-height: 44px; border-radius: 10px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; }
.p-hero { display: flex; align-items: center; gap: 14px; padding: 4px 2px 8px; }
.p-hero .logo { width: 56px; height: 56px; border-radius: 16px; }
.p-hero b { display: block; font-size: 20px; letter-spacing: -.01em; } .p-hero span { font-size: 14px; color: var(--muted); }
.p-sec { margin: 6px 4px -4px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.p-botao { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 12px 14px; border-radius: 16px;
  background: var(--paper); color: var(--fg); border: 1px solid var(--line); font-size: 17px; font-weight: 700; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.p-botao .ic { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 24px;
  background: color-mix(in srgb, var(--accent) 14%, var(--paper)); }
.p-botao .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.p-botao small { display: block; margin-top: 2px; font-weight: 500; font-size: 13px; color: var(--muted); }
.p-botao .chev { flex: none; font-size: 26px; line-height: 1; color: var(--muted); font-weight: 400; }
.p-botao:active { background: var(--bg); }
/* Dados do grupo, tipo o do WhatsApp: foto grande, mídia, links, docs e participantes (May, 05/11/2026) */
.titulo-linha, #logo, #convAv { cursor: pointer; }
.ig-hero { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 8px 0 4px; }
.ig-foto { width: 128px; height: 128px; border-radius: 50%; background: #0E0F12 center / cover; display: grid; place-items: center; font-size: 48px; font-weight: 800; color: #fff; }
.ig-hero h3 { margin: 6px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.ig-hero span { font-size: 14px; color: var(--muted); }
.ig-desc { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; }
.ig-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.ig-tabs button { width: auto; height: auto; min-height: 44px; border-radius: 10px; background: none; color: var(--muted); font-size: 13px; font-weight: 700; display: grid; gap: 1px; place-items: center; padding: 4px 2px; }
.ig-tabs button small { font-size: 11px; font-weight: 600; }
.ig-tabs button.ativa { background: var(--accent); color: var(--accent-fg); }
.ig-grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 14px; overflow: hidden; }
.ig-grade button { width: 100%; height: auto; aspect-ratio: 1; padding: 0; border-radius: 0; background: var(--cinza) center / cover; }
.ig-vazio { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 8px; }
.ig-audio audio { width: 100%; margin-top: 8px; }
.ig-gente { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ig-gente button { width: 100%; height: auto; display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-height: 64px; padding: 10px 14px; background: none; color: inherit; text-align: left; border-top: 1px solid var(--line); border-radius: 0; }
.ig-gente button:first-child { border-top: 0; }
.ig-gente .av { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--cinza) center / cover; display: grid; place-items: center; font-weight: 800; color: #fff; }
.ig-gente .tx { flex: 1; min-width: 0; line-height: 1.25; }
.ig-gente b { display: block; font-size: 15.5px; }

.ig-gente .st { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); }
.ig-gente .st.on { color: var(--accent); }
.p-nota { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
/* Cartão compacto da lista: título, foto, preço; toque abre o detalhe */
.item { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: block; cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.05); text-align: left; }
.item:active { background: var(--bg); }
.item.escolhido { border: 2px solid var(--accent); }
.item .i-corpo { padding: 12px 14px 0; }
.item h3 { margin: 0; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.item .i-corpo h3 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .ph { position: relative; margin: 10px 14px 0; border-radius: 12px; overflow: hidden; display: grid; place-items: center;
  aspect-ratio: 16 / 9; background: color-mix(in srgb, var(--accent) 8%, var(--cinza)); font-size: 34px; }
.item .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; opacity: 0; transition: opacity .2s; }
.item .ph img.ok { opacity: 1; }
.item .ph.sem { aspect-ratio: auto; height: 44px; font-size: 26px; }
.preco-l { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; padding: 10px 14px 14px; }
.preco { font-size: 20px; font-weight: 800; color: var(--accent); }
.frete { font-size: 13px; color: var(--muted); font-weight: 600; } .frete.gratis { color: var(--accent); }
/* Detalhe do item */
.detalhe { display: flex; flex-direction: column; gap: 12px; }
.detalhe .ph { position: relative; overflow: hidden; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 8%, var(--cinza)); margin: 0; aspect-ratio: 4 / 3; border-radius: 16px; font-size: 56px; }

.detalhe .ph.sem { aspect-ratio: auto; height: 96px; }

.detalhe .med { font-size: 15px; font-weight: 600; } .detalhe .det { font-size: 15px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }

.detalhe .links a, .detalhe .gostei { min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 14px; border-radius: 12px;
  font-size: 15px; font-weight: 700; text-decoration: none; }
.detalhe .links a { background: var(--accent); color: var(--accent-fg); }
.detalhe .gostei { width: 100%; background: var(--paper); color: var(--fg); border: 1px solid var(--line); }
.detalhe .nota-box { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.detalhe .nota-box label { font-size: 13px; font-weight: 700; color: var(--muted); }
.detalhe textarea { width: 100%; min-height: 84px; resize: none; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); }
.detalhe .manda { width: 100%; min-height: 48px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-size: 16px; font-weight: 700; }
.detalhe .manda:disabled { opacity: .45; }
.p-lista { display: flex; flex-direction: column; gap: 10px; }
.p-grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
/* Telas do Menu no padrão do app (May, 06/11/2026: "revisão no layout das outras partes pra ficar no mesmo padrão"):
   cartão escuro em degradê na cor do assunto (--c no painel), borda fina, chanfro de luz em cima e sombra embaixo, letra clara */
.painel { --c: var(--accent); }
.painel .p-botao, .painel .ag, .painel .cartao, .painel .item, .painel .viag, .painel .lista-item {
  background: linear-gradient(color-mix(in srgb, var(--c) 30%, var(--paper)), color-mix(in srgb, var(--c) 14%, var(--paper))); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); border-radius: 20px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.10); }
@media (prefers-color-scheme: dark) { .painel .p-botao, .painel .ag, .painel .cartao, .painel .item, .painel .viag, .painel .lista-item {
  background: linear-gradient(color-mix(in srgb, var(--c) 40%, black), color-mix(in srgb, var(--c) 18%, black)); color: #F8FAFC; } .painel .p-botao small, .painel .ag .cx ul { color: rgba(248,250,252,.72); } }
.painel .p-botao .ic, .painel .ag .dt { background: color-mix(in srgb, var(--c) 22%, transparent); color: color-mix(in srgb, var(--c) 75%, var(--fg)); border-radius: 14px; }
.painel .ag .dt b { color: color-mix(in srgb, var(--c) 80%, var(--fg)); }
.painel .ag .cx .tag { background: var(--c); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.painel .cartao h3, .painel .p-sec { color: color-mix(in srgb, var(--c) 72%, var(--fg)); }
.painel .item .ph { background: color-mix(in srgb, var(--c) 18%, transparent); color: color-mix(in srgb, var(--c) 70%, var(--fg)); }
.painel .p-topo { background: linear-gradient(color-mix(in srgb, var(--c) 72%, black), color-mix(in srgb, var(--c) 52%, black)); }
body.na-geral .painel .p-topo { position: relative; background: linear-gradient(160deg, #262A33, #16181E 70%); border-bottom: 0; box-shadow: 0 8px 24px rgba(0,0,0,.45); }   /* o Menu com a cara da Geral (May 12:52): grafite, e a linha embaixo na cor da tela */
body.na-geral .painel .p-topo::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 2px; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); }
body.na-geral .painel { background: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1.4px) 0 0 / 18px 18px, #121419; }
/* Esqueleto (skeleton): enquanto a imagem não chega, um bloco cinza com brilho correndo no lugar dela, sem buraco nem susto (May, 06/11/2026) */
.esq { background: linear-gradient(100deg, color-mix(in srgb, var(--fg) 8%, transparent) 30%, color-mix(in srgb, var(--fg) 16%, transparent) 50%, color-mix(in srgb, var(--fg) 8%, transparent) 70%) 0 0 / 300% 100% !important; animation: esq 1.3s ease-in-out infinite; color: transparent !important; }
@keyframes esq { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .esq { animation: none; } }
img.esq { min-height: 140px; }
.ct-av.carregando { border-radius: 50%; }
.ct-av.carregando, .ig-gente .av.esq, .quem .avatar.esq { background: linear-gradient(100deg, rgba(255,255,255,.08) 30%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.08) 70%) 0 0 / 300% 100%; animation: esq 1.3s ease-in-out infinite; }
.p-azulejo { --c: var(--accent); width: auto; height: auto; min-height: 104px; padding: 12px 6px 11px; border-radius: 22px; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); display: grid; justify-items: center; align-content: center; gap: 8px; font: inherit; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  background: linear-gradient(color-mix(in srgb, var(--c) 45%, black), color-mix(in srgb, var(--c) 22%, black)); box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -4px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.25); }   /* padrão do app: escuro em degradê na cor do assunto, chanfro, letra branca (May/Sigma, 06/11/2026) */

  <main id="lista" hidden></main>

function abreItem(cat, it) {   // detalhe: foto grande (toque amplia), dados, links, "Gostei" e anotação pra Lyra

    const d = document.createElement('div'); d.className = 'detalhe';

    d.append(fotoDe(it, cat, true), h, precoLinha(it));
    if (it.medidas) { const m = document.createElement('div'); m.className = 'med'; m.innerHTML = icone('ruler') + ' '; m.append(document.createTextNode(it.medidas)); d.append(m); }
    if (it.detalhe) { const t = document.createElement('div'); t.className = 'det'; t.textContent = it.detalhe; d.append(t); }
    const links = (it.links || []).filter(l => Array.isArray(l) && linkSeguro(l[1]));   // vindo de JSON: só http(s), nada de "javascript:"
    if (links.length) {
      const ls = document.createElement('div'); ls.className = 'links';
      links.forEach(([nome, url]) => { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = nome + ' '; a.insertAdjacentHTML('beforeend', icone('link')); ls.append(a); });
      d.append(ls);
    }
    // Manda direto pra caixa da Geral e fica no item (ela pediu pra não ser levada pra tela de mensagens).
    const manda = (t, b) => enviarComentario(t, b);
    const g = document.createElement('button'); g.type = 'button'; g.className = 'gostei'; g.innerHTML = icone('star') + ' Gostei';
    g.onclick = () => manda('⭐ Gostei (catálogo, ' + cat.nome + '): ' + it.nome, g);
    d.append(g);
    const nb = document.createElement('div'); nb.className = 'nota-box';
    nb.innerHTML = '<label for="nota-item">Quer falar algo sobre esse item?</label><textarea id="nota-item" rows="3" maxlength="400" placeholder="Ex.: gostei dessa, anota pra mim"></textarea><button type="button" class="manda" disabled>Mandar pra Lyra</button>';
    const ta = nb.querySelector('textarea'), mb = nb.querySelector('.manda');

}

// Foto em tela cheia: toca em qualquer lugar ou no ✕ pra fechar; arrastar pro lado (ou ← →) troca pela anterior/seguinte da conversa.
function fotosDaConversa() { return lastItems.flatMap(x => x.fotos || []); }
function abreZoom(src, path, listaFotos) {   // listaFotos: as fotos do álbum (sem ela, as da conversa)
  const z = document.createElement('div'); z.className = 'zoom';
  const im = document.createElement('img'); im.src = src; im.alt = 'Foto';
  const x = document.createElement('button'); x.type = 'button'; x.className = 'zx'; x.innerHTML = icone('close'); x.setAttribute('aria-label', 'Fechar');
  const cont = document.createElement('div'); cont.className = 'zcont'; cont.hidden = true;
  const salvar = document.createElement('button'); salvar.type = 'button'; salvar.className = 'zsalvar'; salvar.textContent = 'Salvar';
  z.append(im, cont, salvar, x); document.body.append(z);
  const lista = listaFotos || fotosDaConversa(); let i = path ? lista.indexOf(path) : -1;
  const mostraCont = () => { cont.hidden = i < 0 || lista.length < 2; cont.textContent = (i + 1) + ' / ' + lista.length; };
  mostraCont();
  let ocupado = false;
  const vai = async dir => {   // dir: -1 anterior, +1 seguinte; pula foto que já saiu do repo
    if (i < 0 || ocupado) return; ocupado = true;
    try { for (let k = i + dir; k >= 0 && k < lista.length; k += dir) { try { const u = await fotoUrl(lista[k]); i = k; im.src = u; mostraCont(); if (im.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) im.animate([{ transform: 'translateX(' + (dir * 60) + '%) scale(.96)' }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' }); break; } catch (e) {} } }   // a foto nova entra deslizando do lado (May, 07/11/2026 12:52)
    finally { ocupado = false; }
  };
  salvar.onclick = async e => {
    e.stopPropagation();
    const nome = ((i >= 0 ? lista[i] : path) || 'foto.jpg').split('/').pop();
    try {
      const blob = await (await fetch(im.src)).blob();
      const arq = new File([blob], nome, { type: blob.type || tipoDe(nome) });
      if (navigator.canShare && navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq] }); return; }   // iOS: folha de compartilhar → "Salvar imagem"
      baixaArquivo(blob, nome);
    } catch (err) { if (err && err.name !== 'AbortError') showNote('Não consegui salvar a foto.', true); }
  };
  x.onclick = e => { e.stopPropagation(); fecha(); };
  const fecha = () => { z.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') fecha(); else if (e.key === 'ArrowLeft') vai(-1); else if (e.key === 'ArrowRight') vai(1); };
  let t0 = null;
  let horiz = null;   // a foto anda junto com o dedo pro lado e só troca quando solta (May, 07/11/2026 15:29: "a foto mexe junto com meu dedo")
  const temFoto = dir => i >= 0 && i + dir >= 0 && i + dir < lista.length, semMovZ = matchMedia('(prefers-reduced-motion: reduce)').matches;
  z.addEventListener('touchstart', e => { t0 = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; horiz = null; }, { passive: true });
  z.addEventListener('touchmove', e => {
    if (!t0 || semMovZ) return; const dx = e.touches[0].clientX - t0.x, dy = e.touches[0].clientY - t0.y;
    if (horiz === null) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; horiz = lista.length > 1 && Math.abs(dx) > Math.abs(dy) * 1.2; }
    if (!horiz) return;
    const k = temFoto(dx < 0 ? 1 : -1) ? 1 : .3; im.style.transition = 'none'; im.style.transform = 'translateX(' + (dx * k) + 'px) scale(' + (1 - Math.min(.06, Math.abs(dx) / 3000)) + ')';
  }, { passive: true });
  z.addEventListener('touchend', e => {
    if (!t0) return; const t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y; t0 = null;
    if (horiz || (semMovZ && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5)) {
      z.dataset.sw = '1'; setTimeout(() => { delete z.dataset.sw; }, 400);
      const dir = dx < 0 ? 1 : -1;
      if (Math.abs(dx) > 60 && temFoto(dir)) { if (semMovZ) { vai(dir); return; } im.style.transition = 'transform .18s ease-in'; im.style.transform = 'translateX(' + (-dir * innerWidth) + 'px)'; setTimeout(() => { im.style.transition = 'none'; im.style.transform = ''; vai(dir); }, 180); }
      else { im.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; im.style.transform = ''; }
      horiz = null; return;
    }
    if (Math.abs(dy) > 12) { z.dataset.sw = '1'; setTimeout(() => { delete z.dataset.sw; }, 400); }   // puxar pra baixo: quem fecha é o fechaPuxando, seguindo o dedo
  });
  z.onclick = () => { if (!z.dataset.sw) fecha(); };
  fechaPuxando(z, fecha, null, () => im);
  document.addEventListener('keydown', esc);
}

novaBtn.onclick = () => {
  const pop = document.createElement('div'); pop.className = 'pop';

        if (rf.ok || rf.status === 422) fotoLinha = '<!-- foto: ' + caminho + ' -->\n';
      }
      const r = await api(apiDe(arq), { method: 'PUT',
        body: JSON.stringify({ message: 'nova conversa: ' + nome, content: b64encode('# ' + nome.replace(/[\r\n]+/g, ' ') + '\n' + fotoLinha + '\n## Recados\n') }) });
      if (!r.ok && r.status !== 422) throw erroDe(r.status);   // 422 = já existe: só abre

let poll = null;
// Academia (May, 26/10): no horário do treino a página abre SEMPRE no checklist de hoje; a seta ← volta pra conversa.
// menu/treino.json → abrir: { dias: [1..5] (0 = dom), de: 'HH:MM', ate: 'HH:MM', viagem: id, lista: id }
// Além disso (May, 27/10): começou um treino (marcou 1 item) => reabre nele a qualquer hora do dia, até marcar tudo.

const ocupadaNaConversa = () => Date.now() - pushEm < 60000 || !!respondendo || !!box.value.trim() || anexos.length > 0 || !!gravador;
async function abreTreinoSeHora() {
  if (ocupadaNaConversa()) return;
  let d; try { d = JSON.parse(await lerArquivo('menu/treino.json')); } catch (e) { return; }
  if (ocupadaNaConversa()) return;   // o push pode ter chegado enquanto lia o treino.json
  d.viagens.forEach(x => { x._arq = 'menu/treino.json'; });
  zeraSemanaTreino(d.viagens);
  const hoje = diaLocal();
  // Folga (May, 03/11/2026: "nao vou na academia hj, nao precisa abrir automatico, criar uma variavel pra salvar isso"):
  // dia de folga = o treino nao abre sozinho. Botao "Hoje nao vou" (neste aparelho) ou "folgas" no menu/treino.json (todo aparelho).
  if (store.get('treino-folga') === hoje || (d.folgas || []).includes(hoje)) return;
  let ativo = null; try { ativo = JSON.parse(store.get('treino-ativo') || 'null'); } catch (e) {}
  if (ativo && ativo.dia === hoje && painel.hidden) {
    const va = d.viagens.find(x => x.id === ativo.v), la = va && va.listas.find(x => x.id === ativo.l);
    if (la && marcados(va, la).size < totalItens(la)) { menu.hidden = true; painel.hidden = false; pilha = []; abreChecklist(va, la); return; }
    store.set('treino-ativo', '');
  }
  const a = d.abrir; if (!a) return;
  const agora = new Date(), hm = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
  if (!(a.dias || []).includes(agora.getDay()) || hm < a.de || hm > a.ate) return;
  const v = d.viagens.find(x => x.id === a.viagem) || d.viagens[0]; const l = v && v.listas.find(x => x.id === a.lista);
  if (!l || !painel.hidden) return;
  if (store.get('treino-feito') === hoje) return;   // terminou o treino hoje: não abre mais (May, 26/10)
  if (marcados(v, l).size >= totalItens(l)) { store.set('treino-feito', hoje); return; }   // tudo marcado = terminou
  if (store.get('treino-auto') === hoje) return;   // pelo horário abre sozinho só 1x por dia; fechou = o Treino continua no Menu (05/11/2026)
  store.set('treino-auto', hoje);
  menu.hidden = true; painel.hidden = false; pilha = []; abreChecklist(v, l);
}
