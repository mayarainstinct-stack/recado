<style>
/* Paleta da Simplificação (verde #059669, petróleo #1E6685, folha #6BAD3E; escuro com azul #22A7D0). Página estática (GitHub Pages). Cada recado vira uma linha em CAIXA-DE-ENTRADA.md no repo privado, pela API do GitHub,
   com um token que fica só no iPhone dela. Nenhum recado mora nesta página. */
:root {
  --bg: #F2FBF6; --paper: #FFFFFF; --fg: #1E293B; --muted: #64748B; --line: #E2E8F0;
  --head: #0EA371; --head-fg: #FFFFFF; --mine: #2F9E44; --mine-fg: #FFFFFF;
  --theirs: #FFFFFF; --cinza: #EEF1F4; --accent: #059669; --accent-fg: #FFFFFF; --pink: #6BAD3E; --err: #B91C1C;
  --font-ui: "Figtree", "Segoe UI", system-ui, sans-serif; --font-name: "Young Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #08140F; --paper: #0C1A14; --fg: #F1F5F9; --muted: #8B9DAF; --line: #1C3A2E;
    --head: #0B2A20; --head-fg: #ECFDF5; --mine: #237A36; --mine-fg: #F1FFF3; --theirs: #13261E; --cinza: #1B2522;
    --accent: #10B981; --accent-fg: #052E22; --pink: #5FBB53; --err: #FCA5A5; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; overscroll-behavior: none; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; }
.app { position: fixed; top: 0; left: 0; right: 0; margin: 0 auto; height: 100vh; height: var(--altura, 100vh); display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; background: var(--paper); }
/* Topo no padrão dos apps da Simplificação (promotor/checklist): faixa na cor da marca subindo atrás da barra de status,
   cantos de baixo arredondados, logo + "Recados" + status do agente (online/offline), ⋮ à direita, respiro 16. */
header { position: relative; z-index: 2; color: var(--head-fg); font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
  background: var(--head);
  background: linear-gradient(160deg, color-mix(in srgb, var(--head) 80%, #fff) 0%, var(--head) 60%);
  border-radius: 0 0 24px 24px; box-shadow: 0 6px 18px color-mix(in srgb, var(--head) 28%, transparent);
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
  display: grid; gap: 8px; border-radius: 0 0 18px 18px; }
.topo { display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border-radius: 11px; flex: none; background: #fff url("apple-touch-icon.png") center / cover;
  box-shadow: 0 3px 10px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.6); }
.who { min-width: 0; flex: 1; display: grid; gap: 3px; justify-items: start; }
.who h1 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.1; letter-spacing: -.015em; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.18);
  border-radius: 999px; padding: 4px 10px 4px 8px; transition: background-color .3s ease; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: #BBF7D0; box-shadow: 0 0 0 0 rgba(187,247,208,.7); animation: vivo 2s infinite; }
.status.ausente .dot { background: #FDE68A; animation: none; }
.status.off .dot { background: rgba(255,255,255,.55); animation: none; }
.status.off { background: rgba(0,0,0,.12); }
@keyframes vivo { 0% { box-shadow: 0 0 0 0 rgba(187,247,208,.7); } 70% { box-shadow: 0 0 0 7px rgba(187,247,208,0); } 100% { box-shadow: 0 0 0 0 rgba(187,247,208,0); } }
.status .sync { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; display: none; }
.status.on .dot { display: none; }
.status.on .sync { display: block; animation: gira .8s linear infinite; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.16); color: var(--head-fg);
  font-size: 22px; line-height: 1; display: grid; place-items: center; }
.menu { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(66px + env(safe-area-inset-top, 0px));
  background: var(--paper); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 6px; z-index: 5; }
.menu button { width: 100%; height: auto; min-height: 44px; border-radius: 8px; background: none; color: var(--fg); padding: 10px 14px; text-align: left; font-weight: 500; display: block; }
@media (hover: hover) { .menu button:hover { background: var(--bg); } .clip:hover { color: var(--accent); } }
@keyframes gira { to { transform: rotate(360deg); } }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid currentColor; border-top-color: transparent; animation: gira .7s linear infinite; }
.clip { background: none; color: var(--muted); width: 40px; }
.msg .foto { display: block; width: 100%; max-width: 260px; min-height: 120px; max-height: 340px; border-radius: 10px; margin-bottom: 4px;
  background: color-mix(in srgb, var(--accent) 10%, var(--bg)); object-fit: cover; }
/* Animações leves (só CSS): topo desliza, conversa sobe em cascata, botões respondem ao toque. */
header { animation: desce .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes desce { from { transform: translateY(-100%); } }
form { animation: sobe .45s .1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes sobe { from { transform: translateY(100%); } }
#feed.chegando .msg { animation: entra .4s cubic-bezier(.2,.9,.3,1.2) both; }
#feed.chegando .msg:nth-last-child(1) { animation-delay: .35s; }
#feed.chegando .msg:nth-last-child(2) { animation-delay: .28s; }
#feed.chegando .msg:nth-last-child(3) { animation-delay: .21s; }
#feed.chegando .msg:nth-last-child(4) { animation-delay: .14s; }
#feed.chegando .msg:nth-last-child(5) { animation-delay: .07s; }
button { transition: transform .12s ease, opacity .2s ease, background-color .2s ease; }
button:active:not(:disabled) { transform: scale(.9); }
#enviar:not(:disabled) { animation: pulsa .35s ease-out; }
@keyframes pulsa { 50% { transform: scale(1.12); } }
textarea { transition: border-color .2s ease, box-shadow .2s ease; }
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
textarea:focus-visible { outline: none; }
.menu:not([hidden]) { animation: abre .18s ease-out both; transform-origin: top right; }
@keyframes abre { from { opacity: 0; transform: scale(.9); } }
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.overlay-card { display: grid; justify-items: center; gap: 12px; padding: 24px 32px; border-radius: 18px;
  background: var(--paper); color: var(--fg); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.spin.big { width: 38px; height: 38px; border-width: 4px; color: var(--accent); }
.ok-mark { display: none; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-fg);
  font-size: 22px; font-weight: 700; place-items: center; }
.overlay.ok .spin { display: none; }
.overlay.ok .ok-mark { display: grid; animation: entra .3s cubic-bezier(.2,.9,.3,1.3) both; }
#feed { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 4px;
  padding: 10px max(10px, env(safe-area-inset-right, 0px)) 10px max(10px, env(safe-area-inset-left, 0px)); }
.day { align-self: center; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; margin-block: 8px; }
.msg { max-width: 88%; padding: 7px 11px 5px; border-radius: 14px; line-height: 1.4; box-shadow: 0 1px 0 var(--line); }
.msg.may { align-self: flex-end; background: var(--mine); color: var(--mine-fg); border-bottom-right-radius: 4px; }
.msg.lyra { align-self: flex-start; background: var(--theirs); color: var(--fg); border-bottom-left-radius: 4px; }
/* Balão cinza com a borda lateral na cor hex de quem fala; o nome em cima também na cor (pedido dela) */
.msg.grupo { background: var(--cinza); color: var(--fg); border-left: 4px solid var(--quem); }
.msg.grupo .quem { color: var(--quem); }
.msg .quem { font-size: 12.5px; font-weight: 700; margin-bottom: 2px; color: var(--quem); }
.msg { position: relative; touch-action: pan-y; }
.msg .cita { display: grid; gap: 1px; margin: 2px 0 6px; padding: 6px 10px; border-radius: 8px; border-left: 4px solid var(--quem);
  background: rgba(0,0,0,.06); font-size: 13px; line-height: 1.3; }
.msg .cita b { color: var(--quem); font-size: 12.5px; }
.msg .cita span { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.msg .seta-resp { position: absolute; top: 50%; left: -34px; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; background: var(--paper); color: var(--accent); font-size: 14px; opacity: 0; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.msg .audio { display: block; width: 240px; max-width: 100%; height: 40px; margin: 2px 0 4px; }
.msg .transcricao { font-size: 13.5px; font-style: italic; opacity: .85; white-space: pre-wrap; }
.gravando { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 20px;
  background: color-mix(in srgb, #EF4444 10%, var(--bg)); color: var(--fg); font-variant-numeric: tabular-nums; }
.gravando .rec { width: 10px; height: 10px; border-radius: 50%; background: #EF4444; animation: pisca 1s infinite; }
.gravando .dica { color: var(--muted); font-size: 13px; margin-left: auto; }
@keyframes pisca { 50% { opacity: .25; } }
#mic { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#mic:active { transform: scale(1.25); background: #EF4444; color: #fff; }
.opcoes { display: grid; gap: 6px; margin-top: 8px; }
.opcao { width: auto; height: auto; min-height: 40px; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600;
  background: var(--paper); color: var(--quem, var(--accent)); border: 1.5px solid var(--quem, var(--accent)); text-align: left;
  display: block; width: 100%; max-width: 100%; white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
.opcao.escolhida { background: var(--quem, var(--accent)); color: #fff; }
.opcao:disabled:not(.escolhida) { opacity: .45; }
.citando { display: flex; align-items: center; gap: 10px; margin: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  padding: 8px 10px; border-radius: 12px 12px 0 0; background: var(--paper); border: 1px solid var(--line); border-bottom: 0; }
.citando > div { flex: 1; min-width: 0; border-left: 4px solid var(--quem, var(--accent)); padding-left: 8px; display: grid; }
.citando b { font-size: 12.5px; color: var(--quem, var(--accent)); }
.citando span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citando button { width: 32px; height: 32px; background: none; color: var(--muted); font-size: 18px; }
.desce { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: 42px; height: 42px; border-radius: 50%; background: var(--paper); color: var(--fg); box-shadow: 0 2px 10px rgba(0,0,0,.2); z-index: 4; font-size: 18px; }
.desce .qtd { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--accent); color: var(--accent-fg);
  font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.copiavel { border: 1.5px dashed var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--theirs)); max-width: 92%; }
.msg.copiavel .txt { font-size: 14.5px; }
.copiar-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.copiar-btn { width: auto; height: auto; min-height: 40px; border-radius: 999px; padding: 8px 14px; font-size: 13px; letter-spacing: 0; text-transform: none; }
.tick { font-weight: 700; letter-spacing: -2px; color: var(--muted); }
.tick.lida { color: var(--accent); }
.msg.may .tick.lida { color: #9FE0FF; }
.msg.may .meta { color: color-mix(in srgb, var(--mine-fg) 75%, transparent); }
.meta { display: flex; justify-content: flex-end; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.empty, .setup { margin: auto; text-align: center; max-width: 34ch; color: var(--muted); display: grid; gap: 10px; }
.empty strong, .setup strong { color: var(--fg); font-family: var(--font-name); font-weight: 400; font-size: 20px; }
.setup input { font: inherit; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.setup button { justify-self: center; width: auto; border-radius: 999px; padding: 10px 20px; height: auto; }
form { display: flex; gap: 6px; align-items: flex-end; border-top: 1px solid var(--line); background: var(--paper);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
textarea { flex: 1; min-width: 0; resize: none; max-height: 140px; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 20px; padding: 11px 14px; min-height: 46px; }
textarea:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; background: var(--accent);
  color: var(--accent-fg); display: grid; place-items: center; font: inherit; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.msg.novo { animation: entra .35s cubic-bezier(.2,.9,.3,1.3) both; }
.msg.lyra.novo { transform-origin: left bottom; }
.msg.may.novo { transform-origin: right bottom; }
@keyframes entra { from { opacity: 0; transform: translateY(10px) scale(.92); } to { opacity: 1; transform: none; } }
.digitando { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; border-radius: 14px; border-bottom-left-radius: 4px;
  background: var(--theirs); box-shadow: 0 1px 0 var(--line); }
.digitando i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: pula 1s infinite ease-in-out; }
.digitando.fazendo { align-items: center; gap: 5px; }
.digitando.fazendo span { margin-left: 6px; font-size: 13px; color: var(--muted); font-style: italic; }
.digitando i:nth-child(2) { animation-delay: .15s; } .digitando i:nth-child(3) { animation-delay: .3s; }
@keyframes pula { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
.note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px 8px; }
.note.err { color: var(--err); }
.voltar { width: 40px; height: 40px; margin-left: -6px; background: none; color: var(--head-fg); font-size: 26px; line-height: 1; }
#lista { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; position: relative; padding-bottom: 76px; }
.conv { display: flex; align-items: center; gap: 12px; padding: 11px max(14px, env(safe-area-inset-right, 0px)) 11px max(14px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); cursor: pointer; background: var(--paper); }
.conv:active { background: var(--bg); }
.conv .av { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 19px;
  background: color-mix(in srgb, var(--accent) 18%, var(--paper)); color: var(--accent); }
.conv .av.logo-r { background: #fff url("apple-touch-icon.png") center / cover; }
.conv .corpo { flex: 1; min-width: 0; display: grid; gap: 2px; }
.conv .linha { display: flex; align-items: baseline; gap: 8px; }
.conv .nome { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .hora { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.conv.nova .hora { color: var(--accent); font-weight: 700; }
.conv .previa { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .badge { flex: none; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-fg);
  font-size: 12px; font-weight: 700; display: grid; place-items: center; }
#nova { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: auto; height: 48px;
  border-radius: 999px; padding: 0 20px; box-shadow: 0 6px 18px rgba(0,0,0,.22); z-index: 3; }
/* Versão web (abrir com ?web=true): igual WhatsApp Web, lista de conversas à esquerda e a conversa aberta à direita */
@media all {   /* "lado" = a área visível tem 700px ou mais (medido no JS, não na tela do monitor) */
  body.web.lado .app { max-width: 1400px; display: grid; grid-template-columns: 360px 1fr; grid-template-rows: auto 1fr auto auto auto; }
  body.web.lado header { grid-column: 1 / -1; border-radius: 0 0 18px 18px; }
  body.web.lado #lista { grid-column: 1; grid-row: 2 / -1; border-right: 1px solid var(--line); overflow-y: auto; display: block !important; padding-bottom: 80px; }
  body.web.lado #feed, body.web.lado #note, body.web.lado #citando, body.web.lado #composer { grid-column: 2; }
  body.web.lado #feed { grid-row: 2; } body.web.lado #note { grid-row: 3; } body.web.lado #citando { grid-row: 4; } body.web.lado #composer { grid-row: 5; }
  body.web.lado #nova { left: max(16px, calc(50vw - 684px)); right: auto; width: 328px; display: block !important; }
  body.web.lado #voltar { display: none !important; }
  body.web.lado .conv.ativa { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  body.web.lado .desce { right: max(24px, calc(50vw - 676px)); }
}
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); animation: entra .18s ease-out both; }
.zoom img { max-width: 100vw; max-height: 100%; object-fit: contain; touch-action: pinch-zoom; }
.zoom button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; font-size: 20px; }
.msg .foto { cursor: zoom-in; }
.pop { position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.pop .caixa { width: 100%; max-width: 380px; background: var(--paper); color: var(--fg); border-radius: 18px; padding: 18px; display: grid; gap: 12px;
  box-shadow: 0 14px 40px rgba(0,0,0,.3); animation: entra .2s ease-out both; }
.pop h2 { margin: 0; font-size: 18px; }
.pop input[type=text] { font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.pop .foto-grupo { display: flex; align-items: center; gap: 12px; }
.pop .foto-grupo .prev { width: 58px; height: 58px; border-radius: 50%; background: var(--bg) center / cover; border: 1px dashed var(--line); display: grid; place-items: center; font-size: 22px; flex: none; }
.pop .acoes { display: flex; gap: 8px; justify-content: flex-end; }
.pop .acoes button, .pop .foto-grupo button { width: auto; height: auto; border-radius: 999px; padding: 10px 18px; }
.pop .acoes .sec, .pop .foto-grupo button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.conv .av.com-foto { background: center / cover; color: transparent; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>

<script>
const REPO = 'mayarainstinct-stack/Inst';
// Conversas = arquivos: "Geral" é a CAIXA-DE-ENTRADA.md; as outras ficam em caixas/<nome>.md (mesmo formato).
const GERAL = { arq: 'CAIXA-DE-ENTRADA.md', nome: 'Geral' };
const apiDe = arq => 'https://api.github.com/repos/' + REPO + '/contents/' + arq.split('/').map(encodeURIComponent).join('/');
let FILE = null;      // arquivo da conversa aberta (null = está na lista)
let API = null;
let nomeConv = '', fotoConv = '';
const feed = document.getElementById('feed');
const note = document.getElementById('note');
const form = document.getElementById('composer');
const box = document.getElementById('texto');
const sendBtn = document.getElementById('enviar');
const sair = document.getElementById('sair');
let token = '';
let sending = false;

const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};
function showNote(t, err) { note.textContent = t; note.className = 'note' + (err ? ' err' : ''); note.hidden = !t; }
const pad = n => String(n).padStart(2, '0');
const stamp = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
const b64encode = s => { let bin = ''; new TextEncoder().encode(s).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };

async function gh(method, body) {
  const r = await fetch(API + (method === 'GET' ? '?t=' + Date.now() : ''), {
    method, headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) { const e = new Error('http ' + r.status); e.status = r.status; throw e; }
  return r.json();
}

// Título da conversa: primeira linha "# Nome"
function fotoGrupoDe(md) { const m = md.match(/<!--\s*foto:\s*(\S+)\s*-->/); return m ? m[1] : ''; }
function tituloDe(md) { const m = md.match(/^#\s+(.+?)\s*$/m); return m ? m[1].replace(/^📥\s*/, '') : ''; }
// Linhas da caixa: "- [DD/MM/AAAA HH:MM] texto" (dela) e "  ↳ Lyra: texto" (resposta).
function parse(md) {
  const out = []; const lines = md.split('\n'); let on = false;
  for (const line of lines) {
    if (/^##\s+Recados/.test(line)) { on = true; continue; }
    if (on && /^##\s/.test(line)) break;
    if (!on) continue;
    let m = line.match(/^- \[(\d\d\/\d\d\/\d{4}) (\d\d:\d\d)\] (.*)$/);
    if (m) {
      const lida = /\s\{lida\}\s*$/.test(m[3]);
      let text = m[3].replace(/\s\{lida\}\s*$/, '').replace(/\\n/g, '\n');
      const cit = text.match(/\s*⟪re: ([^:⟫]+): ([^⟫]*)⟫\s*$/);   // resposta citando: "⟪re: Nome: trecho⟫"
      if (cit) text = text.slice(0, cit.index);
      const au = text.match(/^🎤 (\S+)\s*$/);           // "🎤 recados-audios/arquivo.m4a"
      const f = text.match(/^📷 (\S+)\s*([\s\S]*)$/);   // "📷 recados-fotos/arquivo.jpg legenda"
      out.push({ from: 'may', day: m[1], time: m[2], lida, foto: f ? f[1] : '', audio: au ? au[1] : '', re: cit ? { nome: cit[1], trecho: cit[2] } : null, text: au ? '' : (f ? f[2] : text) });
      continue;
    }
    const tr = line.match(/^\s+↳ transcrição: (.*)$/);
    if (tr) { const alvo = [...out].reverse().find(x => x.from === 'may' && x.audio); if (alvo) alvo.transcricao = tr[1]; continue; }
    // Respostas no estilo grupo: "  ↳ Lyra: …" ou "  ↳ simp-mobile: …" (cada um com a sua cor)
    // "[op: A|B|C]" = balão de múltipla escolha (ela toca e a resposta vai citando a pergunta)
    m = line.match(/^\s+↳ (Lyra|rm|simp-mobile|promotor|kds)( \[copiar\])?(?: \[op: ([^\]]+)\])?: (.*)$/i);
    if (m) { m = [m[0], m[1], m[2], m[4], m[3]]; }
    if (m) {
      out.forEach(it => { if (it.from === 'may') it.lida = true; });   // respondeu = leu tudo antes
      let txt = m[3].replace(/\\n/g, '\n');
      const cit = txt.match(/\s*⟪re: ([^:⟫]+): ([^⟫]*)⟫\s*$/);
      if (cit) txt = txt.slice(0, cit.index);
      const f = txt.match(/^📷 (\S+)\s*([\s\S]*)$/);   // foto: "📷 recados-fotos/x.jpg legenda"
      out.push({ from: 'lyra', quem: m[1].toLowerCase(), copiar: !!m[2], opcoes: m[4] ? m[4].split('|').map(x => x.trim()).filter(Boolean) : null, foto: f ? f[1] : '', day: out.length ? out[out.length - 1].day : '', time: '', re: cit ? { nome: cit[1], trecho: cit[2] } : null, text: f ? f[2] : txt });
    }
  }
  return out;
}

let shown = -1;          // quantos itens já estavam na tela (-1 = primeira carga, sem animação)
let lastItems = [];

// Abre com as últimas 10 + as que ela ainda não viu; rolar até o topo carrega mais 10.
let janela = 10;
const vistoKey = arq => arq === GERAL.arq ? 'vistos' : 'vistos:' + arq;   // Geral mantém a chave antiga
const rascKey = () => FILE === GERAL.arq ? 'rascunho' : 'rascunho:' + FILE;
let vistosAntes = 0;
let inicio = 0;

// Cores = as que cada projeto usa no VS Code (borda/realce do .vscode/settings.json); Lyra = rosa dela.
const GRUPO = {
  lyra: { nome: 'Lyra', cor: '#E1306C', texto: '#FFFFFF' },
  rm: { nome: 'RM · Recebimento', cor: '#22C55E', texto: '#052E16' },
  'simp-mobile': { nome: 'SIMP-Mobile', cor: '#2DD4BF', texto: '#042F2E' },
  promotor: { nome: 'Promotor', cor: '#F59E0B', texto: '#2D1A02' },
  kds: { nome: 'KDS', cor: '#EAB308', texto: '#2A2002' }
};
let renderizando = false;
function render(items, manterPosicao) {
  renderizando = true; setTimeout(() => { renderizando = false; }, 100);
  const firstNew = shown < 0 ? items.length : shown;
  const naoVistas = Math.max(0, items.length - vistosAntes);
  inicio = Math.max(0, items.length - Math.max(janela, naoVistas));
  const alturaAntes = feed.scrollHeight, topoAntes = feed.scrollTop;
  const pertoDoFim = alturaAntes - topoAntes - feed.clientHeight < 120;
  feed.replaceChildren();
  if (!items.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = '<strong>Caixa vazia</strong><span>Tudo que você mandou já foi anotado. Escreve a próxima ideia aqui embaixo.</span>';
    feed.append(e); return;
  }
  if (inicio > 0) { const mais = document.createElement('div'); mais.className = 'day'; mais.textContent = '↑ role pra ver as antigas'; feed.append(mais); }
  let last = '';
  items.forEach((it, i) => {
    if (i < inicio) return;
    if (it.day && it.day !== last) { const s = document.createElement('div'); s.className = 'day'; s.textContent = it.day; feed.append(s); last = it.day; }
    const el = document.createElement('div'); el.className = 'msg ' + it.from + (it.copiar ? ' copiavel' : '') + (i >= firstNew ? ' novo' : '');
    if (it.quem && GRUPO[it.quem]) {
      // Nome colorido em cima do balão, igual grupo de WhatsApp; o balão ganha um toque da cor de quem fala
      el.style.setProperty('--quem', GRUPO[it.quem].cor); el.style.setProperty('--quem-fg', GRUPO[it.quem].texto); el.classList.add('grupo');
      const nome = document.createElement('div'); nome.className = 'quem'; nome.textContent = GRUPO[it.quem].nome; el.append(nome);
    }
    if (it.re) {
      const q = document.createElement('div'); q.className = 'cita';
      q.style.setProperty('--quem', corDe(it.re.nome));
      const qn = document.createElement('b'); qn.textContent = it.re.nome;
      const qt = document.createElement('span'); qt.textContent = it.re.trecho;
      q.append(qn, qt); el.append(q);
    }
    gestoResponder(el, it);
    if (it.opcoes) {
      // Botões de múltipla escolha embaixo do texto; já respondida = botão escolhido fica marcado
      const resp = items.slice(i + 1).find(x => x.from === 'may' && x.re && it.text.replace(/[⟪⟫:\n]/g, ' ').slice(0, 40).startsWith(x.re.trecho.slice(0, 40)));
      const ops = document.createElement('div'); ops.className = 'opcoes';
      it.opcoes.forEach(op => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'opcao'; b.textContent = op;
        if (resp && resp.text.trim().toUpperCase().startsWith(op.split(')')[0].trim().toUpperCase())) b.classList.add('escolhida');
        if (resp) b.disabled = true;
        b.addEventListener('click', () => { if (sending) return; responder(it); box.value = op; syncBtn(); form.requestSubmit(); });
        ops.append(b);
      });
      setTimeout(() => el.append(ops), 0);
    }
    if (it.copiar) {
      // Balão de texto pronto pra copiar (prompt, lista…): botão no topo
      const bar = document.createElement('div'); bar.className = 'copiar-bar';
      const lab = document.createElement('span'); lab.textContent = 'Pronto pra copiar';
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'copiar-btn'; btn.textContent = 'Copiar';
      btn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(it.text); btn.textContent = 'Copiado ✓'; }
        catch (e) { const r = document.createRange(); r.selectNodeContents(el.querySelector('.txt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selecionado'; }
        setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
      });
      bar.append(lab, btn); el.append(bar);
    }
    if (i >= firstNew && it.from === 'lyra') el.style.animationDelay = '.9s';
    if (it.foto) {
      const img = document.createElement('img'); img.className = 'foto'; img.alt = 'Foto enviada';
      img.addEventListener('click', e => { e.stopPropagation(); if (img.src) abreZoom(img.src); });
      img.onload = () => { if (feed.scrollHeight - feed.scrollTop - feed.clientHeight < 400) feed.scrollTop = feed.scrollHeight; };
      fotoUrl(it.foto).then(u => { img.src = u; }).catch(() => { img.alt = 'Não carregou a foto'; });
      el.append(img);
    }
    if (it.audio) {
      const au = document.createElement('audio'); au.className = 'audio'; au.controls = true; au.preload = 'metadata';
      fotoUrl(it.audio).then(u => { au.src = u; }).catch(() => {});
      el.append(au);
      const tr = document.createElement('div'); tr.className = 'transcricao';
      tr.textContent = it.transcricao ? '“' + it.transcricao + '”' : 'transcrevendo…';
      el.append(tr);
    }
    const t = document.createElement('div'); t.className = 'txt'; t.textContent = it.text;
    if (it.text) el.append(t);
    if (it.time || it.from === 'may') {
      const m = document.createElement('div'); m.className = 'meta';
      const h = document.createElement('span'); h.textContent = it.time; m.append(h);
      if (it.from === 'may') {
        // Igual ao WhatsApp: ✓ cinza = salvo no GitHub · ✓✓ colorido = a Lyra leu
        const tk = document.createElement('span'); tk.className = 'tick' + (it.lida ? ' lida' : '');
        tk.textContent = it.lida ? '✓✓' : '✓'; tk.title = it.lida ? 'Lida pela Lyra' : 'Enviada';
        m.append(tk);
      }
      el.append(m);
    }
    if (i >= firstNew && it.from === 'lyra') {
      // "digitando…" rápido antes da resposta aparecer
      const dots = document.createElement('div'); dots.className = 'digitando'; dots.innerHTML = '<i></i><i></i><i></i>';
      feed.append(dots); el.hidden = true;
      setTimeout(() => { dots.remove(); el.hidden = false; el.style.animationDelay = '0s'; feed.scrollTop = feed.scrollHeight; }, 900);
    }
    feed.append(el);
  });
  if (firstNew === items.length && !manterPosicao && !feed.dataset.jaAbriu) { feed.dataset.jaAbriu = '1'; feed.classList.add('chegando'); setTimeout(() => feed.classList.remove('chegando'), 1200); }
  if (!pertoDoFim && shown > 0 && items.length > shown) { novasLaEmCima += items.length - shown; desceQtd.textContent = novasLaEmCima; desceQtd.hidden = false; }
  shown = items.length;
  if (manterPosicao) feed.scrollTop = feed.scrollHeight - alturaAntes + topoAntes;
  else if (pertoDoFim || firstNew === items.length) feed.scrollTop = feed.scrollHeight;
  if (document.visibilityState === 'visible' && FILE) store.set(vistoKey(FILE), String(items.length));
}

const syncEl = document.getElementById('statusbar');
const statusTxt = document.getElementById('status');
// "Lyra pesquisando…" embaixo da conversa enquanto ela trabalha no recado
let fazendoEl = null;
function mostraFazendo(txt) {
  if (!txt) { if (fazendoEl) { fazendoEl.remove(); fazendoEl = null; } return; }
  if (!fazendoEl) {
    fazendoEl = document.createElement('div'); fazendoEl.className = 'digitando fazendo';
    fazendoEl.innerHTML = '<i></i><i></i><i></i><span></span>';
  }
  fazendoEl.querySelector('span').textContent = txt;
  if (fazendoEl.parentNode !== feed || feed.lastElementChild !== fazendoEl) {
    const perto = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
    feed.append(fazendoEl); if (perto) feed.scrollTop = feed.scrollHeight;
  }
}
// O agente (Claude no notebook) grava a hora no branch "online" a cada ~1 min enquanto o vigia roda.
async function checaOnline() {
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/online.txt?ref=online&t=' + Date.now(),
      { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw' } });
    const linhas = (await r.text()).split(/\r?\n/);
    // online.txt: [batimento] [última atividade] [o que está fazendo]
    const ts = parseInt(linhas[0], 10) * 1000;
    const ativ = (parseInt(linhas[1], 10) || 0) * 1000;
    const on = r.ok && Date.now() - ts < 60000;               // vigia batendo = está olhando = online
    const idade = Date.now() - ts;
    const ausente = r.ok && idade > 60000 && idade < 300000;   // vigia parou há 1–5 min
    mostraFazendo(on && FILE ? linhas.slice(2).join(' ').trim() : '');
    syncEl.classList.toggle('ausente', ausente);
    if (ausente) { syncEl.classList.remove('off'); statusTxt.textContent = 'Agente ausente'; mostraFazendo(''); return; }
    syncEl.classList.toggle('off', !on);
    if (on) statusTxt.textContent = 'Agente online agora';
    else { const min = Math.round((Date.now() - ts) / 60000);
      statusTxt.textContent = isFinite(min) ? 'Agente offline · visto há ' + (min < 60 ? min + ' min' : Math.round(min / 60) + ' h') : 'Agente offline'; }
  } catch (e) { syncEl.classList.add('off'); statusTxt.textContent = 'Agente offline'; }
}

let ultimaChecagem = 0, carregando = null;
let forcar = false;   // recém-aberta: desenha mesmo que esteja vazia
function load() { const p = carregando || (carregando = carregar().finally(() => { if (carregando === p) carregando = null; })); return p; }
async function carregar() {
  const arq = FILE; if (!arq) return null;
  syncEl.classList.add('on');
  try {
    const f = await gh('GET').finally(() => syncEl.classList.remove('on'));
    if (FILE !== arq) return f;   // trocou de conversa enquanto baixava
    const items = parse(b64decode(f.content));
    const same = items.length === lastItems.length && items.every((it, i) => it.text === lastItems[i].text && it.from === lastItems[i].from && it.lida === lastItems[i].lida && it.foto === lastItems[i].foto && it.copiar === lastItems[i].copiar && it.transcricao === lastItems[i].transcricao);
    if (!same || forcar) { forcar = false; if (items.length < shown) shown = items.length; lastItems = items; render(items); }
    checaOnline();
    showNote(''); return f;
  }
  catch (e) { showNote(e.status === 401 ? 'A chave não vale mais. Toca em ⋮ → Trocar chave.' : 'Não consegui ler a caixa. Confere a internet.', true); throw e; }
}

// ---- Fotos: ficam no repo privado em recados-fotos/; a página baixa com a chave e mostra.
const fotos = {};
function tipoDe(path) {
  if (/\.m4a$/i.test(path)) return 'audio/mp4';
  if (/\.webm$/i.test(path)) return 'audio/webm';
  if (/\.png$/i.test(path)) return 'image/png';
  return 'image/jpeg';
}
function fotoUrl(path) {
  if (!fotos[path]) fotos[path] = fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw' }
  }).then(r => { if (!r.ok) throw new Error('foto ' + r.status); return r.arrayBuffer(); })
    .then(buf => URL.createObjectURL(new Blob([buf], { type: tipoDe(path) })))
    .catch(e => { delete fotos[path]; throw e; });
  return fotos[path];
}
function reduzir(file) {
  return new Promise((ok, erro) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = () => erro(new Error('imagem'));
    img.src = url;
  });
}
const arquivo = document.getElementById('arquivo');
document.getElementById('foto').onclick = () => { if (!sending) arquivo.click(); };
arquivo.addEventListener('change', async () => {
  const file = arquivo.files[0]; arquivo.value = ''; if (!file || sending) return;
  sending = true; syncBtn();
  overlay.classList.remove('ok'); overlayTxt.textContent = 'Enviando foto…'; overlay.hidden = false;
  try {
    const b64 = await reduzir(file);
    const d = new Date();
    const nome = 'recados-fotos/' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.jpg';
    const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + nome, {
      method: 'PUT', headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
      body: JSON.stringify({ message: 'foto do iPhone', content: b64 })
    });
    if (!r.ok) throw new Error('upload ' + r.status);
    const legenda = box.value.trim();

// Abre uma conversa: zera o estado da tela e carrega o arquivo dela.

  FILE = c.arq; API = apiDe(c.arq); nomeConv = c.nome; fotoConv = c.foto || (conversas.find(x => x.arq === c.arq) || {}).foto || '';
  logoEl.style.backgroundImage = ''; if (fotoConv) fotoUrl(fotoConv).then(u => { if (FILE === c.arq) logoEl.style.backgroundImage = 'url(' + u + ')'; }).catch(() => {});
  vistosAntes = parseInt(store.get(vistoKey(FILE)) || '0', 10);
  shown = -1; lastItems = []; janela = 10; inicio = 0; forcar = true; carregando = null;
  novasLaEmCima = 0; desceQtd.hidden = true; desce.hidden = true;
  respondendo = null; citando.hidden = true; mostraFazendo(''); showNote('');
  delete feed.dataset.jaAbriu;
  lista.hidden = !largo(); novaBtn.hidden = !largo(); feed.hidden = false; feed.replaceChildren(); form.hidden = false;
  if (largo()) desenhaLista();
  voltar.hidden = !MODO_WEB || largo(); logoEl.hidden = !voltar.hidden ? true : false; tituloEl.textContent = c.nome;
  box.value = store.get(rascKey()); box.style.height = 'auto'; syncBtn();
  return load();
}
voltar.onclick = () => { if (!sending) mostraLista(); };
// Foto em tela cheia (toca em qualquer lugar ou no ✕ pra fechar)
function abreZoom(src) {
  const z = document.createElement('div'); z.className = 'zoom';
  const im = document.createElement('img'); im.src = src; im.alt = 'Foto';
  const x = document.createElement('button'); x.type = 'button'; x.textContent = '✕'; x.setAttribute('aria-label', 'Fechar');
  z.append(im, x); document.body.append(z);
  const fecha = () => { z.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') fecha(); };
  z.onclick = fecha; document.addEventListener('keydown', esc);
}
// Nova conversa: popup da própria página com nome e foto do grupo
novaBtn.onclick = () => {
  const pop = document.createElement('div'); pop.className = 'pop';
  pop.innerHTML = `<form class="caixa" autocomplete="off"><h2>Nova conversa</h2>
    <div class="foto-grupo"><div class="prev" id="np-prev">📷</div><button type="button" id="np-foto">Escolher foto</button><input type="file" id="np-arq" accept="image/*" hidden></div>
    <input type="text" id="np-nome" maxlength="40" placeholder="Nome da conversa (ex.: Casa, Obra, Experfrutty)" required>
    <div class="acoes"><button type="button" class="sec" id="np-x">Cancelar</button><button type="submit" id="np-ok">Criar</button></div></form>`;
  document.body.append(pop);
  const f = pop.querySelector('form'), nomeIn = pop.querySelector('#np-nome'), arqIn = pop.querySelector('#np-arq'), prev = pop.querySelector('#np-prev');
  let fotoB64 = '';
  setTimeout(() => nomeIn.focus(), 50);
  pop.querySelector('#np-x').onclick = () => pop.remove();
  pop.onclick = e => { if (e.target === pop) pop.remove(); };
  pop.querySelector('#np-foto').onclick = () => arqIn.click();
  arqIn.onchange = async () => { const fl = arqIn.files[0]; if (!fl) return;
    try { fotoB64 = await reduzir(fl); prev.textContent = ''; prev.style.backgroundImage = 'url(data:image/jpeg;base64,' + fotoB64 + ')'; } catch (e) { showNote('Não consegui ler essa foto.', true); } };
  f.onsubmit = async e => {
    e.preventDefault();
    const nome = nomeIn.value.trim().slice(0, 40); if (!nome) return;
    const slug = nome.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (!slug) { showNote('Escolhe um nome com letras ou números.', true); return; }
    const arq = 'caixas/' + slug + '.md';
    pop.querySelector('#np-ok').disabled = true;
    overlay.classList.remove('ok'); overlayTxt.textContent = 'Criando conversa…'; overlay.hidden = false;
    try {
      let fotoLinha = '';
      if (fotoB64) {
        const caminho = 'recados-fotos/grupo-' + slug + '.jpg';
        const rf = await fetch(apiDe(caminho), { method: 'PUT', headers: hdrs(false), body: JSON.stringify({ message: 'foto da conversa ' + nome, content: fotoB64 }) });
        if (rf.ok || rf.status === 422) fotoLinha = '<!-- foto: ' + caminho + ' -->\n';
      }
      const r = await fetch(apiDe(arq), { method: 'PUT', headers: hdrs(false),
        body: JSON.stringify({ message: 'nova conversa: ' + nome, content: b64encode('# ' + nome.replace(/[\r\n]+/g, ' ') + '\n' + fotoLinha + '\n## Recados\n') }) });
      if (!r.ok && r.status !== 422) throw new Error('put ' + r.status);   // 422 = já existe: só abre
      pop.remove(); overlay.hidden = true;
      await carregaLista().catch(() => {});
      abrir({ arq, nome }).catch(() => {});
    } catch (err) { overlay.hidden = true; pop.querySelector('#np-ok').disabled = false; showNote('Não consegui criar a conversa. Confere a internet.', true); }
  };
};

let poll = null;
function start() {
  aplicaLargura();
  mais.hidden = false;
  if (querResponder) {   // veio da notificação: abre a Geral já respondendo
    querResponder = false; history.replaceState(null, '', location.pathname);
    abrir(GERAL).then(responderUltima).catch(() => {});
  } else if (MODO_WEB) mostraLista();
  else abrir(GERAL).catch(() => {});   // celular: só a Geral
  // Conversa aberta: busca a cada 4 s; lista de conversas: a cada 15 s (só com a página na tela).
  clearInterval(poll);
  poll = setInterval(() => {
    if (document.visibilityState !== 'visible' || !token || sending) return;
    if (FILE) load().catch(() => {});
    if ((!FILE || largo()) && Date.now() - ultimaLista > 14000) carregaLista().catch(() => {});
  }, 4000);
}
// Toda vez que ela volta pra página depois de um tempo fora, recarrega inteira (pega layout novo) e desce pro fim.
let saiuEm = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { saiuEm = Date.now(); return; }
  if (saiuEm && Date.now() - saiuEm > 30000 && !sending) { location.reload(); return; }
  if (token) (FILE ? load() : carregaLista()).catch(() => {});
});
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
sair.onclick = () => { store.set('gh-token', ''); token = ''; askToken(); };

token = store.get('gh-token');
token ? start() : askToken();
</script>
