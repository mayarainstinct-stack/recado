<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><script src="socorro.js?v=5"></script>

<title>Máquinas e consoles</title>

<style>
@font-face{font-family:Inter;src:url(fontes/Inter-Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fontes/Inter-Bold.ttf);font-weight:700}
:root{--fundo:#070A14;--texto:#F5F8FC;--texto2:#C9D1E3;--texto3:#8C96AE;--vidro:rgba(255,255,255,.07);--borda:rgba(255,255,255,.14);--k1:#4F46E5;--k2:#4F46E5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--fundo);color:var(--texto);font-family:Inter,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* fundo: a foto da máquina escolhida, tingida na cor dela, com as riscas de tela (Máquinas = um sistema próprio, May 07/11/2026 11:26) */
#fundo{position:fixed;inset:0;z-index:0;background:var(--fundo) center/cover no-repeat;transition:background-image .01s}
#fundo::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 85% 0%,color-mix(in srgb,var(--k1) 55%,transparent),transparent 60%),linear-gradient(180deg,rgba(7,10,20,.35),rgba(7,10,20,.88) 45%,#070A14 80%)}
#fundo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);overflow:hidden}   /* uma tela só, sem rolar pra baixo: o resto vai em abas que deslizam (May 07/11 11:27) */
.topo{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 12px}.anota{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--vidro);border:1px solid var(--borda);color:var(--texto);cursor:pointer;padding:0}.anota svg{width:20px;height:20px}.anota:active{transform:scale(.92)}
.topo .marca-sis{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--texto2)}
.topo .marca-sis i{width:10px;height:10px;border-radius:3px;background:var(--k1);box-shadow:0 0 10px var(--k1);transform:rotate(45deg)}
.topo .tot{margin-left:auto;font-size:12px;color:var(--texto3)}
/* a fileira de máquinas, igual à tela inicial de um console */
#fundo.marca{background-position:center}
.card .logo{position:absolute;right:-14px;top:-10px;width:116px;height:116px;opacity:.26;object-fit:contain;transform:rotate(-8deg)}.card .logo-txt{position:absolute;right:6px;top:-4px;font-size:64px;font-weight:800;font-style:italic;opacity:.2;letter-spacing:-.04em}
.grade{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:6px 16px 96px;align-content:start;animation:entra .32s cubic-bezier(.2,.8,.2,1)}
.card{position:relative;overflow:hidden;min-height:132px;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;text-align:left;color:#fff;font:inherit;cursor:pointer;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 85%,#000),color-mix(in srgb,var(--c) 35%,#000));border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}.card img.rob{inset:auto 8px 8px auto;width:58px;height:58px;opacity:.95;object-fit:contain}
.card .cur{position:absolute;top:10px;left:12px;font-weight:800;font-size:13px;letter-spacing:.1em}.card b{position:relative;font-size:16px;line-height:1.15;padding-right:44px;text-shadow:0 1px 8px rgba(0,0,0,.6)}.card small{position:relative;font-size:11.5px;opacity:.88}.card:has(img.rob) small,.card:has(img.rob) b{padding-right:60px}.card small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bloco-tit{grid-column:1/-1;margin:8px 2px -2px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--texto2)}.card.diag-largo{grid-column:1/-1;min-height:132px;flex-direction:row;align-items:flex-end;justify-content:flex-start;gap:14px;padding:18px;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,0) 85%),url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96' fill='none' stroke='%23C4B5FD' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' opacity='.55'%3E%3Crect x='8' y='10' width='34' height='24' rx='3'/%3E%3Cpath d='M19 40h12M25 34v6M12 22h7l3-6 4 12 3-6h9'/%3E%3Crect x='56' y='58' width='30' height='21' rx='3' transform='rotate(-12 71 68)'/%3E%3Cpath d='M58 70l6 0 3-5 3 9 3-4h8' transform='rotate(-12 71 68)'/%3E%3Ccircle cx='74' cy='20' r='3'/%3E%3Ccircle cx='20' cy='74' r='2'/%3E%3C/svg%3E") 0 0/96px 96px repeat,linear-gradient(135deg,#6D28D9,#2E1065);box-shadow:0 10px 24px rgba(139,92,246,.35)}.diag-robs{margin-left:auto;display:flex;align-self:flex-end;padding-bottom:4px}.diag-robs img{width:46px;height:46px;border-radius:50%;margin-left:-4px;background:#1a1033;box-shadow:0 0 0 2px #2E1065,0 0 0 4px var(--rc);position:relative}.diag-robs img:first-child{margin-left:0}.diag-robs img[class^=pior-]{z-index:1;transform:translateY(-6px) scale(1.12)}.diag-robs img.pior-atencao{box-shadow:0 0 0 2px #2E1065,0 0 0 4px #F5B700,0 0 14px #F5B700}.diag-robs img.pior-ruim{box-shadow:0 0 0 2px #2E1065,0 0 0 4px #E5484D,0 0 14px #E5484D}.diag-ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14)}.diag-ic svg{width:30px;height:30px}.diag-tx{display:flex;flex-direction:column;gap:2px;min-width:0;padding-bottom:4px}.diag-tx b{font-size:22px}.diag-tx b{padding-right:0}
body.maq-inativa #fundo{filter:grayscale(1) brightness(.8)}body.maq-inativa .palco img,body.maq-inativa .robo-mora img{filter:grayscale(1)}
.card.inativo{filter:grayscale(1) brightness(.75);opacity:.85}.selo-inativo{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff}
.jg-tit{margin:12px 0 6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texto2)}.jg{list-style:none;display:grid;gap:4px}.jg li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:14px}.jg li small{color:var(--texto3);font-weight:700}.jg-mais{color:var(--texto3);font-size:12px!important}
.robo-mora{display:flex;align-items:center;gap:14px}.robo-mora img{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 0 24px var(--k1)}.robo-mora b{display:block;font-size:20px}.robo-mora small{color:var(--texto2)}
.volta-col{font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;background:var(--vidro);border:1px solid var(--borda);color:var(--texto);cursor:pointer}
.fila{flex:none;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 20px 16px;scroll-padding-left:20px;scrollbar-width:none}
.fila::-webkit-scrollbar{display:none}
.bloco{flex:none;scroll-snap-align:start;width:76px;height:76px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 85%,#000),color-mix(in srgb,var(--c) 35%,#000));border:2px solid rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.06em;transition:transform .22s cubic-bezier(.2,.8,.2,1.15),border-color .2s}
.bloco img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.bloco span{position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.bloco.ativo{transform:scale(1.14);border-color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 70%,transparent),0 10px 26px color-mix(in srgb,var(--c) 45%,transparent)}
.nomefila{flex:none;padding:0 16px;font-size:12px;color:var(--texto3);min-height:16px}
/* destaque da máquina escolhida */
.palco{flex:none;padding:14px 16px 0;animation:entra .32s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{transform:translateX(28px)}to{transform:none}}
.palco .selos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.selo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--vidro);border:1px solid var(--borda);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.selo.marca{background:var(--k1);border-color:transparent;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--k1) 60%,transparent)}
.palco h1{font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.palco .apelido{margin-top:6px;font-size:15px;color:var(--texto2)}
.abas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 16px 8px;flex:none}.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:var(--vidro);border:1px solid var(--borda);color:var(--texto2);transition:background .2s,color .2s}
.abas button.on{background:var(--k1);border-color:transparent;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--k1) 60%,transparent)}
.trilho{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}.trilho::-webkit-scrollbar{display:none}
.pag{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding-bottom:0}   /* sem faixa vazia embaixo: o miolo vai até o fim da tela e termina acima do voltar (May 08/11 11:50) */
.vidro{margin:0 16px;border-radius:20px;padding:14px;background:rgba(14,18,32,.62);border:1px solid var(--borda);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.vidro h2{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--texto2);margin-bottom:10px}
.vidro h2::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--k1);box-shadow:0 0 8px var(--k1)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.disco{margin:14px 0 14px}.disco+.disco{margin-top:4px}.diag-selo{display:inline-block;margin-bottom:12px}.ed-bt.ed-tx{width:auto;border-radius:20px;padding:0 16px;font-size:14px;font-weight:700}.disco-tx{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px;font-size:13px;color:var(--texto2)}.disco-tx b{color:var(--texto)}.disco.aperto .disco-tx b{color:#FF6B6F}
.trilho-prog{position:relative;display:block;height:10px;overflow:hidden;background:rgba(255,255,255,.1);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}.trilho-prog>i{display:block;height:100%;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 5px,transparent 5px 10px),var(--trilho-cor,var(--k1));clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%,0 5px)}.disco.aperto .trilho-prog{--trilho-cor:#E5484D}
.nums div{border-radius:14px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.nums b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 14px color-mix(in srgb,var(--k1) 70%,transparent)}
.nums small{font-size:11px;color:var(--texto3)}
.prog{margin-top:12px;font-size:12px;color:var(--texto2);display:grid;gap:6px}
.prog i{display:block;height:10px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.prog i{height:14px;border-radius:4px;transform:skewX(-18deg)}
.prog i.ouro::before{background:repeating-linear-gradient(90deg,transparent 0 0),linear-gradient(100deg,#8A6416,#F5D237 30%,#FFF6C8 45%,#E2B33A 60%,#8A6416);box-shadow:0 0 18px #F5D237,0 0 4px #FFF6C8;animation:brilho 2.4s linear infinite;background-size:100% 100%,220% 100%}
@keyframes brilho{from{background-position:0 0,100% 0}to{background-position:0 0,-120% 0}}   /* 100% = troféu: dourado metálico, bem diferente do 99% (May 07/11 11:57) */
.prog i::before{content:"";display:block;height:100%;width:var(--p);background:repeating-linear-gradient(90deg,var(--bc) 0 9px,transparent 9px 13px);box-shadow:0 0 12px color-mix(in srgb,var(--bc) 60%,transparent)}   /* barra tracejada do launcher: UMA cor só, que vai da cor do console (0%) ao dourado da parede da vitória (100%) (May 07/11 11:48 e 11:51) */
.hist{font-size:15px;line-height:1.5;color:var(--texto)}
.ficha div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}
.ficha div:first-child{border-top:0}
.ficha span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--texto3);padding-top:2px}
.ins{display:flex;flex-wrap:wrap;gap:8px}
.ins span{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--k1) 18%,rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--k1) 50%,transparent)}
.ins span::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--k1);box-shadow:0 0 8px var(--k1);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:13px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.fotos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.fotos::-webkit-scrollbar{display:none}
.fotos button{flex:none;width:120px;height:120px;border-radius:14px;background:#111 center/cover;border:1px solid var(--borda)}
.falta li{margin:4px 0 4px 18px;color:var(--texto2);font-size:14px}
.voltar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(14,18,32,.8);border:1px solid var(--borda);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 2px color-mix(in srgb,var(--k1) 60%,transparent)}
.zoom{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}.zoom img{max-width:100%;max-height:100%;border-radius:12px}
.aviso{padding:40px 16px;color:var(--texto2);font-size:15px}
@media (prefers-reduced-motion:reduce){.palco{animation:none}.bloco{transition:none}}
.ed-bt{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--vidro);border:1px solid var(--borda);color:var(--texto);cursor:pointer;padding:0;font-size:22px;line-height:1}
.ed-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}.ed-card{width:100%;max-width:520px;max-height:92dvh;overflow:auto;box-sizing:border-box;background:#12162a;color:var(--texto);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border:1px solid var(--borda)}
.ed-card h3{margin:0 0 12px;font-size:17px}.ed-card label{display:block;margin-bottom:10px}.ed-card label>span{display:block;font-size:12px;font-weight:700;color:var(--texto3);margin:0 2px 4px}.ed-card input,.ed-card textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--borda);background:rgba(255,255,255,.06);color:var(--texto)}
.ed-acoes{display:flex;gap:10px;align-items:center;margin-top:6px}.ed-ok{flex:1;height:46px;border-radius:999px;border:0;background:var(--k1);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.ed-link{background:none;border:0;color:#ff8a8a;font:inherit;font-weight:700;padding:10px;cursor:pointer}.ed-erro{color:#ff8a8a;font-size:13px;margin:4px 0}
.ed-faixa{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#222842;color:#fff;border-radius:14px;padding:12px 14px;border:1px solid var(--borda)}.ed-faixa button{background:none;border:0;color:#9fb4ff;font-weight:800;font:inherit;cursor:pointer}
.falta li{display:list-item}.falta .ok-bt{margin-left:8px;border:1px solid var(--borda);background:var(--vidro);color:var(--texto2);border-radius:999px;font-size:11px;padding:2px 8px;cursor:pointer}.desc li{color:var(--texto3);font-size:13px;margin:3px 0 3px 18px;text-decoration:line-through}.desc li small{text-decoration:none;display:inline-block;margin-left:6px}
/* #322 Máquinas como painel de hardware (análise externa 14/11 08:06): cada cartão ganha uma parte de hardware com dado real (estado, modelo, geração, zerados/jogos); o fundo de cada console continua (Nyx) */
.hw{position:relative;display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.hw .led{flex:none;width:9px;height:9px;border-radius:50%;background:#3A3F4B;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.hw .led.ok{background:#39E87A;box-shadow:0 0 8px #39E87A,0 0 2px #fff inset}.hw .led.atencao{background:#FFB020;box-shadow:0 0 8px #FFB020,0 0 2px #fff inset}.hw .led.mal{background:#FF4B4B;box-shadow:0 0 8px #FF4B4B,0 0 2px #fff inset}
.hw .pl{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hw .vis{flex:none;font-family:Consolas,"Cascadia Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.hw .vu{display:flex;gap:2px;flex:1}.hw .vu i{flex:1;height:7px;border-radius:2px;background:rgba(255,255,255,.14)}.hw .vu i.on{background:var(--vc,#39E87A);box-shadow:0 0 6px var(--vc,#39E87A)}
/* a) rack: placa de metal escovado com 2 parafusos, LED, modelo gravado e visor âmbar */
.hw-a .hw{margin:8px -12px -12px;padding:8px 22px;background:linear-gradient(180deg,#3B3F48,#22252C 55%,#191B20);border-top:1px solid rgba(255,255,255,.22);color:#C9CED8;text-shadow:0 1px 0 rgba(0,0,0,.8)}
.hw-a .hw::before,.hw-a .hw::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E6E9EF,#6B7080)}.hw-a .hw::before{left:8px}.hw-a .hw::after{right:8px}
.hw-a .hw .vis{padding:2px 6px;border-radius:4px;background:#0B0703;color:#FFB020;font-size:12px;text-shadow:0 0 6px rgba(255,176,32,.8);box-shadow:inset 0 1px 3px #000}
/* b) visor LCD: faixa de cristal verde com letra escura, como tela de portátil antigo */
.hw-b .hw{padding:6px 10px;border-radius:8px;background:linear-gradient(180deg,#B4C98A,#9BB46E);color:#1E2B12;border:2px solid #20231C;box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4);font-family:Consolas,"Cascadia Mono",ui-monospace,monospace;letter-spacing:.04em}
.hw-b .hw .led{border:1px solid rgba(0,0,0,.4)}.hw-b .hw .vis{font-size:12px}
/* c) etiqueta de patrimônio: adesivo prateado colado torto no canto, com código de barras */
.hw-c .hw{position:absolute;top:10px;right:10px;margin:0;flex-direction:column;align-items:flex-start;gap:3px;padding:6px 8px 5px;border-radius:4px;background:linear-gradient(135deg,#F4F5F7,#C9CDD4);color:#1B1E24;transform:rotate(-3deg);box-shadow:0 3px 8px rgba(0,0,0,.45);font-size:9px;max-width:112px}

const FORMAS={

const SNES_COR=['#E8434C','#F3C83C','#3DAA5C','#3E6FD8']
function sorteio(semente){let a=0;for(const ch of semente)a=(a*31+ch.charCodeAt(0))>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const usa=(k,i,x,y,s,rot,extra)=>'<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rot.toFixed(0)+') scale('+s.toFixed(2)+')" '+(extra||'')+'>'+FORMAS[k][i%FORMAS[k].length]+'</g>'
function desenhaFundo(est,k,cor){
  const R=sorteio(k+est),W=400,H=300;let g='<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+cor+'"/><stop offset="1" stop-color="#03050c"/></linearGradient>'
  g+='<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fd2"/><stop offset=".5" stop-color="#9aa8ff"/><stop offset="1" stop-color="#5ff2ff"/></linearGradient>'
  g+='<linearGradient id="vol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="'+cor+'"/><stop offset="1" stop-color="#03050c"/></linearGradient>'
  g+='<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bl"><feGaussianBlur stdDeviation="2.2"/></filter></defs>'
  if(est==="a"){   // confete de símbolos de vários tamanhos
    g+='<rect width="'+W+'" height="'+H+'" fill="'+cor+'"/><rect width="'+W+'" height="'+H+'" fill="url(#bg)" opacity=".35"/>'
    for(let i=0;i<120;i++){const s=3+R()*9,cs=k==="snes"?SNES_COR[i%4]:'#fff';g+=usa(k,i,R()*W,R()*H,s,R()*360,'fill="'+(k==="snes"&&i%2?cs:'none')+'" stroke="'+cs+'" stroke-width="'+(1.6/s).toFixed(2)+'" opacity="'+(.18+R()*.45).toFixed(2)+'"')}
  }else if(est==="b"){   // símbolos grandes em neon, com brilho
    g+='<rect width="'+W+'" height="'+H+'" fill="url(#bg)"/><circle cx="330" cy="40" r="140" fill="'+cor+'" opacity=".55" filter="url(#bl)"/>'
    const pos=[[300,70,48,-18],[200,190,38,12],[350,210,30,24],[120,90,26,-30]]
    pos.forEach(([x,y,s,r],i)=>{g+=usa(k,i,x,y,s,r,'fill="none" stroke="url(#neon)" stroke-width="'+(5/s).toFixed(2)+'" filter="url(#gl)"')})
    for(let i=0;i<40;i++)g+='<circle cx="'+(R()*W).toFixed(0)+'" cy="'+(R()*H).toFixed(0)+'" r="'+(R()*1.4+.3).toFixed(1)+'" fill="#fff" opacity="'+(R()*.7).toFixed(2)+'"/>'
  }else if(est==="c"){   // formas 3D flutuando: uma cópia escura atrás dá o volume, as do fundo ficam borradas
    g+='<rect width="'+W+'" height="'+H+'" fill="url(#bg)"/>'
    for(let i=0;i<22;i++){const x=R()*W,y=R()*H,s=8+R()*30,r=R()*360,longe=s<16,f=longe?' filter="url(#bl)"':'',sw=(0.9).toFixed(2)
      g+='<g'+f+' opacity="'+(longe?.55:.95)+'">'+usa(k,i,x+s*.18,y+s*.18,s,r,'fill="#03050c" stroke="#03050c" stroke-width="'+sw+'" opacity=".6"')+usa(k,i,x,y,s,r,'fill="url(#vol)" stroke="url(#vol)" stroke-width="'+sw+'"')+'</g>'}
  }else{   // escuro com cubos e rastros de luz, os símbolos pequenos no meio
    g+='<rect width="'+W+'" height="'+H+'" fill="#05070f"/><rect width="'+W+'" height="'+H+'" fill="url(#bg)" opacity=".55"/>'
    for(let i=0;i<16;i++){const x=R()*W,y=R()*H,s=10+R()*34,o=(.15+R()*.35).toFixed(2);g+='<g opacity="'+o+'" transform="translate('+x.toFixed(0)+' '+y.toFixed(0)+') scale('+(s/20).toFixed(2)+')"><path d="M0 -10L9 -5V5L0 10L-9 5V-5Z" fill="#9aa3b8"/><path d="M0 -10L9 -5L0 0L-9 -5Z" fill="#e2e6f0"/><path d="M0 0V10L9 5V-5Z" fill="#5d6577"/></g>'}
    const cores=['#ff4fa3','#4fe3ff','#7dff8a','#c58bff'];for(let i=0;i<4;i++){const x0=R()*W,y0=R()*H;g+='<path d="M'+x0.toFixed(0)+' '+y0.toFixed(0)+' q '+(R()*160-80).toFixed(0)+' '+(R()*-120).toFixed(0)+' '+(R()*220-110).toFixed(0)+' '+(R()*-60).toFixed(0)+'" fill="none" stroke="'+cores[i]+'" stroke-width="1.6" opacity=".8" filter="url(#gl)"/>'}
    for(let i=0;i<4;i++)g+=usa(k,i,186+(i%2)*28,140+Math.floor(i/2)*24,8,0,'fill="none" stroke="#fff" stroke-width=".18" opacity=".9"')
  }
  return 'url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">'+g+'</svg>')+'")'
}
function aplicaFundo(el,x,w,cheio){   // o fundo renderizado da máquina (casa/fotos/maquinas/wallpaper/fundo-<id>.jpg, gerar-fundos.py) com o degradê PRETO de baixo pra cima por cima, pra ler o nome (May 19:13); sem a imagem, fica o desenho em SVG
  if(!w)return;const k=x.robo?"pc":W_DE[x.console],id=x.robo?x.id:(W_FOTO[x.console]||x.console),preto="linear-gradient(0deg,rgba(0,0,0,"+(cheio?.92:.88)+") 0%,rgba(0,0,0,"+(cheio?.55:.45)+") 42%,rgba(0,0,0,0) 78%)"
  el.style.backgroundImage=preto+","+desenhaFundo(ESTILO,k,w.cor);el.style.backgroundSize="cover,cover";el.style.backgroundPosition="center,center";el.style.backgroundRepeat="no-repeat,no-repeat"
  foto("casa/fotos/maquinas/wallpaper/fundo-"+id+".jpg").then(u=>{el.style.backgroundImage=preto+",url("+u+")"}).catch(()=>{})
}
let jogosCache=null
function jogosDe(m){   // os jogos da máquina pelo nome do console no tela-jogos.json (PC2 = os jogos de PC)
  jogosCache=jogosCache||gh("categorias/games/tela-jogos.json",true).then(r=>r.ok?r.json():Promise.reject())
  return jogosCache.then(t=>{const c=(t.consoles||[]).find(x=>x.id===m.console),nome=m.id==="pc2"?"PC":(c?c.nome:m.nome);return(t.jogos||[]).filter(j=>j.console===nome)})
}
function fotoFundo(x){const k=W_FOTO[x.console];return k?foto("casa/fotos/maquinas/wallpaper/"+k+".jpg"):Promise.reject()}
function wallpaper(x){const k=x.robo?"pc":W_DE[x.console];if(!k)return null;const [bg,g]=W_SVG[k],cor0=bg||cor(x);return{cor:cor0,url:'url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">'+g+'</svg>')+'")'}}
const MARCA_SVG={ps1:"playstation",ps2:"playstation",ps4:"playstation",ps5:"playstation",switch:"switch","3ds":"3ds",snes:"snes",n64:"n64"},svgs={}
function logo(x){const k=x.robo?"pc":MARCA_SVG[x.console];if(!k)return Promise.reject();if(svgs[k])return svgs[k];return svgs[k]=gh("marca/consoles/"+k+".svg",true).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(t.replace(/currentColor/g,"#ffffff").replace(/color="[^"]*"/,'color="#ffffff"')))}
function foto(p){if(!p)return Promise.reject();if(fotos[p])return fotos[p];return fotos[p]=gh(p,true).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>URL.createObjectURL(b))}
const cor=m=>m.robo&&ROBO[m.robo]?ROBO[m.robo][1]:(m.cor||"#4F46E5")
const app=document.getElementById("app"),fundo=document.getElementById("fundo")
const volta=()=>{if(history.length>1&&/app\.html/.test(document.referrer))history.back();else location.replace("app.html#menu")}   // volta pelo histórico: o botão e o deslizar fazem a mesma rota (May 12:37)
// ===== Editar a coleção pelo app (May, 09/11/2026: tudo editável, sem Claude): grava direto em casa/maquinas.json; apagar só marca "apagado" (com data e hora) e tem desfazer
const ARQ="casa/maquinas.json",agoraBr=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
const b64e=t=>{let b="";new TextEncoder().encode(t).forEach(c=>b+=String.fromCharCode(c));return btoa(b)},b64d=t=>new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\s/g,"")),c=>c.charCodeAt(0)))
async function grava(muda,msg){
  for(let t=0;t<4;t++){try{const r=await gh(ARQ,false);if(!r.ok)return null;const j=await r.json(),d=JSON.parse(b64d(j.content));muda(d)
    const w=await fetch(apiDe(ARQ),{method:"PUT",headers:{Authorization:"Bearer "+TOKEN,Accept:"application/vnd.github+json"},body:JSON.stringify({message:msg,content:b64e(JSON.stringify(d,null,1)+"\n"),sha:j.sha})})
    if(w.ok)return d;if(w.status!==409&&w.status!==422)return null}catch(e){if(t===3)return null}await new Promise(o=>setTimeout(o,600))}return null}
const salva=async(muda,msg)=>{const ok=await grava(muda,msg);if(!ok)aviso("Não guardou: confere a internet e tenta de novo.");return !!ok}
function aviso(t){document.querySelector(".ed-faixa")?.remove();const f=el("div","ed-faixa",t);document.body.append(f);setTimeout(()=>f.remove(),5000)}
function faixaDesfazer(t,fn){document.querySelector(".ed-faixa")?.remove();const f=el("div","ed-faixa"),b=el("button","","Desfazer");b.type="button";const fim=setTimeout(()=>f.remove(),8000);b.onclick=()=>{clearTimeout(fim);f.remove();fn()};f.append(el("span","",t),b);document.body.append(f)}
const CAMPOS=[["nome","Nome",0,1],["apelido","Apelido"],["modelo","Modelo"],["onde","Onde fica"],["dono","De quem"],["papel","Papel"],["desde","Desde"],["como_veio","Como veio",1],["controles","Controles",1],["estado","Estado",1],["historia","História",1],["acessorios","Acessórios (um por linha)",2],["conquistas","Insígnias (uma por linha)",2],["falta","A descobrir (um por linha)",2]]
function formulario(titulo,x,aoSalvar,aoApagar){
  const ov=el("div","ed-ov"),card=el("form","ed-card"),els={};ov.append(card);card.append(el("h3","",titulo));const fecha=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)fecha()}
  CAMPOS.forEach(([n,rot,tp,ob])=>{const lb=el("label"),i=el(tp?"textarea":"input");if(tp)i.rows=tp===2?3:2;i.value=tp===2?(x[n]||[]).join("\n"):(x[n]||"");els[n]=i;lb.append(el("span","",rot+(ob?" *":"")),i);card.append(lb)})
  const er=el("p","ed-erro");er.hidden=true;const ac=el("div","ed-acoes"),ok=el("button","ed-ok","Guardar");ok.type="submit";ac.append(ok)
  if(aoApagar){const ap=el("button","ed-link","Apagar");ap.type="button";ap.onclick=()=>{fecha();aoApagar()};ac.append(ap)}
  const cancela=el("button","ed-link","Cancelar");cancela.type="button";cancela.style.color="var(--texto3)";cancela.onclick=fecha;ac.append(cancela);card.append(er,ac)
  card.onsubmit=async e=>{e.preventDefault();const v={};for(const [n,,tp] of CAMPOS){const t=els[n].value.trim();v[n]=tp===2?t.split(/\r?\n/).map(a=>a.trim()).filter(Boolean):t}
    if(!v.nome){er.textContent="Falta preencher: Nome";er.hidden=false;return}ok.disabled=true;await aoSalvar(v);fecha()}
  document.body.append(ov)}
const idNovo=n=>(String(n).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||"maquina")+"-"+Date.now().toString(36)
