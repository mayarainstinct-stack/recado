<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Máquinas e consoles</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Inter;src:url(fontes/Inter-Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fontes/Inter-Bold.ttf);font-weight:700}
:root{--fundo:#070A14;--texto:#F5F8FC;--texto2:#C9D1E3;--texto3:#8C96AE;--vidro:rgba(255,255,255,.07);--borda:rgba(255,255,255,.14);--k1:#4F46E5;--k2:#4F46E5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--fundo);color:var(--texto);font-family:Inter,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* fundo: a foto da máquina escolhida, tingida na cor dela, com as riscas de tela (Máquinas = um sistema próprio, May 07/11/2026 11:26) */
#fundo{position:fixed;inset:0;z-index:0;background:var(--fundo) center/cover no-repeat;transition:background-image .01s}
#fundo::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 85% 0%,color-mix(in srgb,var(--k1) 55%,transparent),transparent 60%),linear-gradient(180deg,rgba(7,10,20,.35),rgba(7,10,20,.88) 45%,#070A14 80%)}
#fundo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 0 calc(84px + env(safe-area-inset-bottom));overflow:hidden}   /* uma tela só, sem rolar pra baixo: o resto vai em abas que deslizam (May 07/11 11:27) */
.topo{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 12px}
.topo .marca-sis{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--texto2)}
.topo .marca-sis i{width:10px;height:10px;border-radius:3px;background:var(--k1);box-shadow:0 0 10px var(--k1);transform:rotate(45deg)}
.topo .tot{margin-left:auto;font-size:12px;color:var(--texto3)}
/* a fileira de máquinas, igual à tela inicial de um console */
#fundo.marca{background-size:120px 120px;background-repeat:repeat;background-position:center}
.card .logo{position:absolute;right:-14px;top:-10px;width:116px;height:116px;opacity:.26;object-fit:contain;transform:rotate(-8deg)}.card .logo-txt{position:absolute;right:6px;top:-4px;font-size:64px;font-weight:800;font-style:italic;opacity:.2;letter-spacing:-.04em}
.grade{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:6px 16px 24px;align-content:start;animation:entra .32s cubic-bezier(.2,.8,.2,1)}
.card{position:relative;overflow:hidden;min-height:132px;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;text-align:left;color:#fff;font:inherit;cursor:pointer;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 85%,#000),color-mix(in srgb,var(--c) 35%,#000));border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}.card img.rob{inset:auto 8px 8px auto;width:58px;height:58px;opacity:.95;object-fit:contain}
.card .cur{position:absolute;top:10px;left:12px;font-weight:800;font-size:13px;letter-spacing:.1em}.card b{position:relative;font-size:16px;line-height:1.15;padding-right:44px;text-shadow:0 1px 8px rgba(0,0,0,.6)}.card small{position:relative;font-size:11.5px;opacity:.88}.card:has(img.rob) small,.card:has(img.rob) b{padding-right:60px}
.volta-col{font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;background:var(--vidro);border:1px solid var(--borda);color:var(--texto);cursor:pointer}
.fila{flex:none;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 20px 16px;scroll-padding-left:20px;scrollbar-width:none}
.fila::-webkit-scrollbar{display:none}
.bloco{flex:none;scroll-snap-align:start;width:76px;height:76px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 85%,#000),color-mix(in srgb,var(--c) 35%,#000));border:2px solid rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.06em;transition:transform .22s cubic-bezier(.2,.8,.2,1.15),border-color .2s}
.bloco img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.bloco span{position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.bloco.ativo{transform:scale(1.14);border-color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 70%,transparent),0 10px 26px color-mix(in srgb,var(--c) 45%,transparent)}
.nomefila{flex:none;padding:0 16px;font-size:12px;color:var(--texto3);min-height:16px}
/* destaque da máquina escolhida */
.palco{flex:none;padding:14px 16px 0;animation:entra .32s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{transform:translateX(28px)}to{transform:none}}
.palco .selos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.selo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--vidro);border:1px solid var(--borda);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.selo.marca{background:var(--k1);border-color:transparent;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--k1) 60%,transparent)}
.palco h1{font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.palco .apelido{margin-top:6px;font-size:15px;color:var(--texto2)}
.abas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 16px 8px;flex:none}.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:var(--vidro);border:1px solid var(--borda);color:var(--texto2);transition:background .2s,color .2s}
.abas button.on{background:var(--k1);border-color:transparent;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--k1) 60%,transparent)}
.trilho{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}.trilho::-webkit-scrollbar{display:none}
.pag{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding-bottom:8px}
.vidro{margin:0 16px;border-radius:20px;padding:14px;background:rgba(14,18,32,.62);border:1px solid var(--borda);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.vidro h2{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--texto2);margin-bottom:10px}
.vidro h2::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--k1);box-shadow:0 0 8px var(--k1)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{border-radius:14px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.nums b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 14px color-mix(in srgb,var(--k1) 70%,transparent)}
.nums small{font-size:11px;color:var(--texto3)}
.prog{margin-top:12px;font-size:12px;color:var(--texto2);display:grid;gap:6px}
.prog i{display:block;height:10px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.prog i{height:14px;border-radius:4px;transform:skewX(-18deg)}
.prog i.ouro::before{background:repeating-linear-gradient(90deg,transparent 0 0),linear-gradient(100deg,#8A6416,#F5D237 30%,#FFF6C8 45%,#E2B33A 60%,#8A6416);box-shadow:0 0 18px #F5D237,0 0 4px #FFF6C8;animation:brilho 2.4s linear infinite;background-size:100% 100%,220% 100%}
@keyframes brilho{from{background-position:0 0,100% 0}to{background-position:0 0,-120% 0}}   /* 100% = troféu: dourado metálico, bem diferente do 99% (May 07/11 11:57) */
.prog i::before{content:"";display:block;height:100%;width:var(--p);background:repeating-linear-gradient(90deg,var(--bc) 0 9px,transparent 9px 13px);box-shadow:0 0 12px color-mix(in srgb,var(--bc) 60%,transparent)}   /* barra tracejada do launcher: UMA cor só, que vai da cor do console (0%) ao dourado da parede da vitória (100%) (May 07/11 11:48 e 11:51) */
.hist{font-size:15px;line-height:1.5;color:var(--texto)}
.ficha div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}
.ficha div:first-child{border-top:0}
.ficha span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--texto3);padding-top:2px}
.ins{display:flex;flex-wrap:wrap;gap:8px}
.ins span{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--k1) 18%,rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--k1) 50%,transparent)}
.ins span::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--k1);box-shadow:0 0 8px var(--k1);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:13px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.fotos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.fotos::-webkit-scrollbar{display:none}
.fotos button{flex:none;width:120px;height:120px;border-radius:14px;background:#111 center/cover;border:1px solid var(--borda)}
.falta li{margin:4px 0 4px 18px;color:var(--texto2);font-size:14px}
.voltar{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(14,18,32,.8);border:1px solid var(--borda);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 2px color-mix(in srgb,var(--k1) 60%,transparent)}
.zoom{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}.zoom img{max-width:100%;max-height:100%;border-radius:12px}
.aviso{padding:40px 16px;color:var(--texto2);font-size:15px}
@media (prefers-reduced-motion:reduce){.palco{animation:none}.bloco{transition:none}}
</style>
</head>
<body>
<div id="fundo"></div>
<div id="app"><p class="aviso">Carregando a coleção…</p></div>
<button class="voltar" id="voltar" aria-label="Voltar pro Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<script>
// Máquinas e consoles como sistema próprio (May, 07/11/2026 11:26: "cada item do menu tem que parecer um sistema novo"). Dados: casa/maquinas.json (Inst privado),
// cor de cada console = a mesma da página Jogos; PC na cor do robô que mora nele. Números = os da página Jogos (gerados com as mesmas regras).
const REPO="mayarainstinct-stack/Inst",TOKEN=(()=>{try{return localStorage.getItem("gh-token")||""}catch(e){return""}})()
const apiDe=p=>"https://api.github.com/repos/"+REPO+"/contents/"+p.split("/").map(encodeURIComponent).join("/")
const gh=(p,raw)=>fetch(apiDe(p),{cache:"no-cache",headers:{Authorization:"Bearer "+TOKEN,Accept:raw?"application/vnd.github.raw":"application/vnd.github+json"}})
const ROBO={orfeu:["Orfeu","#E31B23","avatares/orfeu-96.png"],nyx:["Nyx","#6FCF00","avatares/nyx-96.png"],vega:["Vega","#1D4ED8","avatares/vega-96.png"],hermes:["Hermes","#FFCB05","avatares/hermes-96.png"]}
const MARCA={ps1:"PlayStation",ps2:"PlayStation",ps4:"PlayStation",ps5:"PlayStation",switch:"Nintendo","3ds":"Nintendo",snes:"Nintendo",n64:"Nintendo",x360:"Xbox"}
const CURTO={ps1:"PS1",ps2:"PS2",ps4:"PS4",switch:"Switch","3ds":"3DS",snes:"SNES",x360:"360"}
const GERACAO={snes:"4ª geração",ps1:"5ª geração",ps2:"6ª geração",x360:"7ª geração",ps4:"8ª geração",switch:"8ª geração","3ds":"8ª geração"},SELO={"3ds":"portátil",switch:"híbrido"}
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const fotos={}
// Papel de parede de cada console (May 18:54: "fundo do PlayStation azul e X, bolinha, triângulo de branco, tipo wallpaper oficial de console").
// Formas desenhadas aqui em SVG, nada de wallpaper baixado nem logo da marca (Sigma 18:58, regra de copyright).
const W_SVG={
  ps:["#0B3FA8",'<g fill="none" stroke="#fff" stroke-width="3" opacity=".22" stroke-linecap="round" stroke-linejoin="round"><path d="M28 14l12 20H16z"/><circle cx="92" cy="26" r="11"/><path d="M18 82l20 20M38 82l-20 20"/><rect x="80" y="80" width="22" height="22" rx="2"/></g>'],
  switch:["#D7192E",'<g fill="none" stroke="#fff" stroke-width="3" opacity=".22" stroke-linecap="round"><rect x="20" y="22" width="24" height="56" rx="12"/><rect x="76" y="22" width="24" height="56" rx="12"/><circle cx="32" cy="38" r="5"/><circle cx="88" cy="58" r="5"/><path d="M60 92v14M53 99h14"/></g>'],
  "3ds":["#B0122B",'<g fill="none" stroke="#fff" stroke-width="3" opacity=".22" stroke-linecap="round"><circle cx="34" cy="34" r="12"/><path d="M84 22v24M72 34h24"/><circle cx="34" cy="90" r="4"/><circle cx="48" cy="90" r="4"/><rect x="70" y="78" width="30" height="22" rx="4"/></g>'],
  snes:["#5B4D8E",'<g opacity=".32"><circle cx="30" cy="30" r="9" fill="#E8434C"/><circle cx="48" cy="48" r="9" fill="#F3C83C"/><circle cx="30" cy="66" r="9" fill="#3DAA5C"/><circle cx="12" cy="48" r="9" fill="#3E6FD8"/></g><g fill="none" stroke="#fff" stroke-width="3" opacity=".2"><path d="M86 74v30M71 89h30"/></g>'],
  x360:["#127C1F",'<g fill="none" stroke="#fff" stroke-width="3" opacity=".22" stroke-linecap="round"><circle cx="36" cy="36" r="18"/><path d="M26 26l20 20M46 26l-20 20"/><circle cx="90" cy="88" r="7"/><circle cx="76" cy="102" r="3"/><circle cx="104" cy="74" r="3"/></g>'],
  pc:[null,'<g fill="none" stroke="#fff" stroke-width="2.5" opacity=".2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 30h30l10 10h30M80 40v30l10 10h20M20 90h40l10-10"/><circle cx="10" cy="30" r="3"/><circle cx="110" cy="80" r="3"/><circle cx="20" cy="90" r="3"/><rect x="44" y="52" width="22" height="22" rx="3"/></g>']}
const W_DE={ps1:"ps",ps2:"ps",ps4:"ps",ps5:"ps",switch:"switch","3ds":"3ds",snes:"snes",x360:"x360"}
function wallpaper(x){const k=x.robo?"pc":W_DE[x.console];if(!k)return null;const [bg,g]=W_SVG[k],cor0=bg||cor(x);return{cor:cor0,url:'url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">'+g+'</svg>')+'")'}}
const MARCA_SVG={ps1:"playstation",ps2:"playstation",ps4:"playstation",ps5:"playstation",switch:"switch","3ds":"3ds",snes:"snes",n64:"n64"},svgs={}
function logo(x){const k=x.robo?"pc":MARCA_SVG[x.console];if(!k)return Promise.reject();if(svgs[k])return svgs[k];return svgs[k]=gh("marca/consoles/"+k+".svg",true).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(t.replace(/currentColor/g,"#ffffff").replace(/color="[^"]*"/,'color="#ffffff"')))}
function foto(p){if(!p)return Promise.reject();if(fotos[p])return fotos[p];return fotos[p]=gh(p,true).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>URL.createObjectURL(b))}
const cor=m=>m.robo&&ROBO[m.robo]?ROBO[m.robo][1]:(m.cor||"#4F46E5")
const app=document.getElementById("app"),fundo=document.getElementById("fundo")
const volta=()=>{if(history.length>1&&/app\.html/.test(document.referrer))history.back();else location.replace("app.html#menu")}   // volta pelo histórico: o botão e o deslizar fazem a mesma rota (May 12:37);document.getElementById("voltar").onclick=volta
{let bx=null,by=0;addEventListener("touchstart",e=>{const t=e.touches[0];bx=t.clientX<28?t.clientX:null;by=t.clientY},{passive:true});addEventListener("touchend",e=>{if(bx===null)return;const t=e.changedTouches[0],dx=t.clientX-bx,dy=t.clientY-by;bx=null;if(dx>70&&Math.abs(dy)<dx*.7)volta()},{passive:true})}   // arrastar da borda esquerda pra direita = voltar, igual o resto do app (May 07/11 11:28)
let D=null,atual=0
async function inicio(){
  if(!TOKEN){app.innerHTML='<p class="aviso">Abre primeiro o app de recados neste aparelho (ele guarda a chave).</p>';return}
  try{const r=await gh("casa/maquinas.json",true);if(!r.ok)throw 0;D=JSON.parse(await r.text())}catch(e){app.innerHTML='<p class="aviso">Não consegui abrir a coleção. Confere a internet.</p>';return}
  grade()
}
function grade(){
  document.documentElement.style.setProperty("--k1","#4F46E5");fundo.style.backgroundImage="none";app.replaceChildren()
  const topo=el("div","topo"),ms2=el("div","marca-sis");ms2.append(el("i"),"Minha coleção");const t=D.total||{}
  topo.append(ms2,el("span","tot",D.maquinas.length+" máquinas · "+(t.zerados??"–")+" zerados"));app.append(topo)
  const g=el("div","grade");D.maquinas.forEach((x,j)=>{const b=el("button","card");b.style.setProperty("--c",cor(x));b.setAttribute("aria-label",x.nome)
    {const w=wallpaper(x);if(w){b.style.setProperty("--c",w.cor);b.style.backgroundImage=w.url+",linear-gradient(150deg,color-mix(in srgb,"+w.cor+" 92%,#fff),color-mix(in srgb,"+w.cor+" 70%,#000))";b.style.backgroundSize="120px 120px,cover"}}
    if(x.robo&&ROBO[x.robo]){const im=el("img","rob");im.alt="";im.src=ROBO[x.robo][2];b.append(im)}
    const st=x.stats;b.append(el("span","cur",CURTO[x.console]||(x.robo?"PC":"")),el("b","",x.nome),el("small","",st?(st.zerados||0)+" zerados · "+(st.jogos||0)+" jogos":(x.modelo||x.papel||"")))
    b.onclick=()=>monta(j);g.append(b)})
  {const b=el("button","card");b.style.setProperty("--c","#8B5CF6");b.append(el("span","cur","PCs"),el("b","","Diagnóstico"),el("small","","a saúde dos PCs"));b.onclick=()=>{location.href="app.html#diagnostico"};g.append(b)}
  app.append(g)
}
function monta(i){
  atual=i;const ms=D.maquinas,m=ms[i],k=cor(m);try{sessionStorage.setItem("maq-atual",m.id)}catch(e){}
  document.documentElement.style.setProperty("--k1",k)
  {const w=wallpaper(m);fundo.classList.toggle("marca",!!w);fundo.style.backgroundImage=w?w.url:"none";fundo.style.backgroundColor=w?w.cor:""}   // fundo = o logo da marca repetido, não a foto (May 18:45); as fotos ficam na aba Fotos
  app.replaceChildren()
  const topo=el("div","topo"),vt=el("button","volta-col","← Coleção");vt.onclick=grade;const t=D.total||{}
  topo.append(vt,el("span","tot",(t.zerados??"–")+" zerados"));app.append(topo)
  const fila=el("div","fila");ms.forEach((x,j)=>{const b=el("button","bloco"+(j===i?" ativo":""));b.style.setProperty("--c",cor(x));b.setAttribute("aria-label",x.nome)
    if(x.robo&&ROBO[x.robo]){const im=el("img");im.alt="";im.src=ROBO[x.robo][2];b.append(im)}else b.append(el("span","",CURTO[x.console]||x.nome.slice(0,4)))
    b.onclick=()=>{if(j!==atual)monta(j)};fila.append(b)});
  {const b=el("button","bloco diag");b.style.setProperty("--c","#8B5CF6");b.setAttribute("aria-label","Diagnóstico: a saúde dos PCs");b.innerHTML='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M6.5 11H9l1.5-3 2.5 6 1.5-3h3M9 21h6M12 17v4"/></svg>';b.onclick=()=>{location.href="app.html#diagnostico"};fila.append(b)}   // o Diagnóstico mora aqui dentro (Sigma, 07/11 11:42)app.append(fila,el("div","nomefila",ms.length+" máquinas e o Diagnóstico no fim · desliza pro lado"))
  requestAnimationFrame(()=>{const a=fila.children[i];if(a)fila.scrollTo({left:Math.max(0,a.offsetLeft-20),behavior:"smooth"})})
